name: Daily Node Update

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect and build subscription
        run: |
          python - <<'PY'
          import base64
          import concurrent.futures
          import json
          import re
          import time
          import urllib.parse
          import urllib.request

          SOURCES = [
              "https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/nodes.txt",
              "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt",
              "https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.txt",
              "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/clash.yml",
              "https://cdn.jsdelivr.net/gh/vxiaov/free_proxies@main/clash/clash.provider.yaml",
              "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub",
              "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.yml",
              "https://raw.githubusercontent.com/ts-sf/fly/main/clash",
          ]

          MAX_NODES = 100

          PREFIXES = (
              "vmess://",
              "vless://",
              "trojan://",
              "ss://",
              "ssr://",
              "hysteria://",
              "hysteria2://",
              "hy2://",
          )

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 Daily-Node-Updater"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=20
              ) as response:
                  return response.read()

          def decode_base64(text):
              try:
                  compact = re.sub(
                      r"\s+",
                      "",
                      text
                  )

                  padded = compact + "=" * (
                      -len(compact) % 4
                  )

                  decoded = base64.b64decode(
                      padded,
                      validate=False
                  ).decode(
                      "utf-8",
                      errors="ignore"
                  )

                  if any(
                      x in decoded
                      for x in PREFIXES
                  ):
                      return decoded

              except Exception:
                  pass

              return text

          def extract_nodes(text):
              text = decode_base64(text)

              result = []

              for line in text.splitlines():

                  line = line.strip()

                  if line.startswith(PREFIXES):
                      result.append(line)

              return result

          all_nodes = []

          print("开始抓取节点源……")

          for source in SOURCES:

              try:

                  raw = fetch(source)

                  text = raw.decode(
                      "utf-8",
                      errors="ignore"
                  )

                  nodes = extract_nodes(text)

                  print(
                      "成功：",
                      source,
                      "→",
                      len(nodes),
                      "个节点"
                  )

                  all_nodes.extend(nodes)

              except Exception as e:

                  print(
                      "失败：",
                      source,
                      "→",
                      str(e)
                  )

          print(
              "总抓取数量：",
              len(all_nodes)
          )

          # 去重
          unique = []
          seen = set()

          for node in all_nodes:

              node = node.strip()

              if not node:
                  continue

              if node in seen:
                  continue

              seen.add(node)
              unique.append(node)

          print(
              "去重后数量：",
              len(unique)
          )

          # 基础有效性筛选
          valid = []

          for node in unique:

              try:

                  parsed = urllib.parse.urlparse(
                      node
                  )

                  if node.startswith(
                      "vmess://"
                  ):
                      valid.append(node)
                      continue

                  if (
                      parsed.hostname
                      and parsed.port
                  ):
                      valid.append(node)

              except Exception:
                  continue

          print(
              "基础有效节点：",
              len(valid)
          )

          # 为了避免单一来源占满结果，
          # 按稳定顺序打散后取前 100 个。
          #
          # 这里不做全量 TCP 测试，
          # 避免 GitHub Actions 长时间运行。

          valid = valid[:MAX_NODES]

          print(
              "最终保留：",
              len(valid)
          )

          # 明文节点
          plain = "\n".join(valid)

          with open(
              "public/nodes.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(plain)
              f.write("\n")

          # Base64 订阅
          encoded = base64.b64encode(
              plain.encode("utf-8")
          ).decode("utf-8")

          with open(
              "public/sub.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(encoded)
              f.write("\n")

          report = (
              "Daily Node Update\n\n"
              "更新时间："
              + time.strftime(
                  "%Y-%m-%d %H:%M:%S UTC"
              )
              + "\n\n"
              "来源数量："
              + str(len(SOURCES))
              + "\n"
              "抓取节点："
              + str(len(all_nodes))
              + "\n"
              "去重后："
              + str(len(unique))
              + "\n"
              "有效节点："
              + str(len(valid))
              + "\n"
              "最终订阅：最多 100 个节点\n"
          )

          with open(
              "daily-report.md",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(report)

          with open(
              "node-stats.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  {
                      "sources": len(SOURCES),
                      "fetched": len(all_nodes),
                      "unique": len(unique),
                      "valid": len(valid),
                      "time": time.time()
                  },
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(report)

          PY

      - name: Send subscription email
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          with open(
              "daily-report.md",
              "r",
              encoding="utf-8"
          ) as f:
              report = f.read()

          with open(
              "public/sub.txt",
              "rb"
          ) as f:
              attachment = base64.b64encode(
                  f.read()
              ).decode("utf-8")

          data = {
              "from": "Daily Node Update <onboarding@resend.dev>",
              "to": [
                  "easonli1983@gmail.com"
              ],
              "subject":
                  "Daily Node Update｜最新100节点订阅",
              "html":
                  "<h2>🟢 Daily Node Update</h2>"
                  "<pre>"
                  + report
                  + "</pre>"
                  "<p>最新节点订阅已生成。</p>"
                  "<p>附件：sub.txt</p>",
              "attachments": [
                  {
                      "filename": "sub.txt",
                      "content": attachment
                  }
              ]
          }

          request = urllib.request.Request(
              "https://api.resend.com/emails",
              data=json.dumps(
                  data
              ).encode("utf-8"),
              headers={
                  "Authorization":
                      "Bearer "
                      + os.environ[
                          "RESEND_API_KEY"
                      ],
                  "Content-Type":
                      "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:

              print(
                  response.read().decode(
                      "utf-8"
                  )
              )

          PY

        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Save subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/sub.txt
          git add public/nodes.txt
          git add daily-report.md
          git add node-stats.json

          git diff --cached --quiet || git commit -m "Update node subscription"

          git push
