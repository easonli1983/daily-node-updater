name: Node Auto Optimizer

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. 安裝工具
      # ============================================================
      - name: Install tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            jq \
            python3 \
            python3-yaml \
            docker.io

          echo "下載 mihomo"

          MIHOMO_VERSION="v1.19.29"

          curl -L \
            --fail \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 120 \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz" \
            -o mihomo.gz

          gunzip -f mihomo.gz

          chmod +x mihomo

          ./mihomo -v


      # ============================================================
      # 3. 抓取節點
      # ============================================================
      - name: Fetch nodes
        run: |
          set +e

          rm -f all-nodes.txt
          rm -f unique-nodes.txt
          rm -f nodes.txt
          rm -f clash.yaml
          rm -f optimized.yaml
          rm -f sub.txt
          rm -f daily-report.md

          SOURCES=(
            "https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/nodes.txt"
            "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt"
            "https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.txt"
            "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/clash.yml"
            "https://cdn.jsdelivr.net/gh/vxiaov/free_proxies@main/clash/clash.provider.yaml"
            "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub"
            "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.yml"
            "https://raw.githubusercontent.com/ts-sf/fly/main/clash"
          )

          total=0
          success=0
          failed=0

          echo "================================"
          echo "開始抓取節點"
          echo "================================"

          for i in "${!SOURCES[@]}"; do

            n=$((i + 1))

            url="${SOURCES[$i]}"

            file="source-${n}.txt"

            echo
            echo "[$n/${#SOURCES[@]}]"
            echo "$url"

            if curl -L \
              --fail \
              --connect-timeout 15 \
              --max-time 45 \
              --retry 2 \
              --retry-delay 2 \
              -A "Mozilla/5.0" \
              -sS \
              "$url" \
              -o "$file"; then

              count=$(grep -Eo \
                '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                "$file" 2>/dev/null | wc -l)

              if [ "$count" -gt 0 ]; then

                grep -Eo \
                  '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                  "$file" >> all-nodes.txt

                total=$((total + count))
                success=$((success + 1))

                echo "識別到：$count"

              else

                echo "沒有識別到 URI 節點"

              fi

            else

              echo "來源抓取失敗"

              failed=$((failed + 1))

            fi

            rm -f "$file"

          done

          echo
          echo "================================"
          echo "抓取完成"
          echo "================================"

          echo "來源：${#SOURCES[@]}"
          echo "成功：$success"
          echo "失敗：$failed"
          echo "抓取節點：$total"

          if [ ! -s all-nodes.txt ]; then
            echo "沒有抓到任何節點"
            exit 1
          fi

          sort -u all-nodes.txt > unique-nodes.txt

          UNIQUE=$(wc -l < unique-nodes.txt)

          cp unique-nodes.txt nodes.txt

          echo "去重後：$UNIQUE"


      # ============================================================
      # 4. 啟動本機 HTTP 文件服務
      # ============================================================
      - name: Start local file server
        run: |
          set -e

          echo "啟動本機文件服務"

          python3 -m http.server 8000 \
            --bind 127.0.0.1 \
            > http-server.log 2>&1 &

          echo $! > http-server.pid

          sleep 2

          curl -fsS \
            http://127.0.0.1:8000/nodes.txt \
            -o /tmp/test-nodes.txt

          echo "本機文件服務正常"

          wc -l /tmp/test-nodes.txt


      # ============================================================
      # 5. 啟動本機 subconverter
      # ============================================================
      - name: Start subconverter
        run: |
          set -e

          echo "下載 subconverter"

          docker pull tindy2013/subconverter:latest

          echo "啟動 subconverter"

          docker run -d \
            --name subconverter \
            --network host \
            tindy2013/subconverter:latest

          echo "等待 subconverter"

          for i in $(seq 1 30); do

            if curl -fsS \
              http://127.0.0.1:25500/version \
              > /dev/null 2>&1; then

              echo "subconverter 已啟動"
              break

            fi

            sleep 2

          done

          curl -fsS \
            http://127.0.0.1:25500/version

          echo


      # ============================================================
      # 6. URI → Clash
      # ============================================================
      - name: Convert nodes to Clash
        run: |
          set -e

          echo "開始轉換"

          curl -fsS \
            --max-time 180 \
            "http://127.0.0.1:25500/sub?target=clash&url=http://127.0.0.1:8000/nodes.txt&emoji=false" \
            -o clash.yaml

          if [ ! -s clash.yaml ]; then
            echo "Clash 配置為空"
            exit 1
          fi

          echo "Clash 配置生成完成"

          python3 - <<'PY'
          import yaml

          with open(
              "clash.yaml",
              "r",
              encoding="utf-8"
          ) as f:
              data = yaml.safe_load(f)

          proxies = data.get(
              "proxies",
              []
          )

          print(
              "Clash 節點：",
              len(proxies)
          )

          if len(proxies) < 5:
              raise SystemExit(
                  "Clash 節點少於 5 個"
              )

          PY


      # ============================================================
      # 7. 建立 mihomo 配置
      # ============================================================
      - name: Build mihomo config
        run: |
          set -e

          python3 - <<'PY'
          import yaml

          with open(
              "clash.yaml",
              "r",
              encoding="utf-8"
          ) as f:
              data = yaml.safe_load(f)

          proxies = []

          used_names = set()

          for i, proxy in enumerate(
              data.get("proxies", [])
          ):

              if not isinstance(
                  proxy,
                  dict
              ):
                  continue

              name = proxy.get("name")

              if not name:
                  name = f"node-{i}"

              name = str(name)

              if name in used_names:
                  name = f"{name}-{i}"

              proxy["name"] = name

              used_names.add(name)

              proxies.append(proxy)

          if len(proxies) < 5:
              raise SystemExit(
                  "沒有足夠節點"
              )

          config = {}

          config["mixed-port"] = 7890

          config["external-controller"] = \
              "127.0.0.1:9090"

          config["proxies"] = proxies

          config["proxy-groups"] = [
              {
                  "name": "AUTO",
                  "type": "url-test",
                  "url":
                      "https://www.gstatic.com/generate_204",
                  "interval": 30,
                  "tolerance": 0,
                  "proxies":
                      [
                          p["name"]
                          for p in proxies
                      ]
              }
          ]

          config["rules"] = [
              "MATCH,AUTO"
          ]

          with open(
              "mihomo.yaml",
              "w",
              encoding="utf-8"
          ) as f:

              yaml.safe_dump(
                  config,
                  f,
                  allow_unicode=True,
                  sort_keys=False
              )

          print(
              "mihomo 節點：",
              len(proxies)
          )

          PY


      # ============================================================
      # 8. 啟動 mihomo
      # ============================================================
      - name: Start mihomo
        run: |
          set -e

          mkdir -p mihomo-data

          ./mihomo \
            -d ./mihomo-data \
            -f ./mihomo.yaml \
            > mihomo.log 2>&1 &

          echo $! > mihomo.pid

          echo "等待 mihomo 啟動"

          for i in $(seq 1 30); do

            if curl -fsS \
              http://127.0.0.1:9090/version \
              > /dev/null 2>&1; then

              echo "mihomo 已啟動"

              break

            fi

            sleep 2

          done

          curl -fsS \
            http://127.0.0.1:9090/version

          echo


      # ============================================================
      # 9. 實際測試節點
      # ============================================================
      - name: Test nodes
        run: |
          set -e

          echo "================================"
          echo "開始實際測試節點"
          echo "================================"

          sleep 30

          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import time

          with urllib.request.urlopen(
              "http://127.0.0.1:9090/proxies/AUTO",
              timeout=20
          ) as r:

              data = json.loads(
                  r.read().decode("utf-8")
              )

          names = data.get(
              "all",
              []
          )

          print(
              "待測節點：",
              len(names)
          )

          results = []

          for index, name in enumerate(
              names,
              1
          ):

              try:

                  encoded = urllib.parse.quote(
                      name,
                      safe=""
                  )

                  url = (
                      "http://127.0.0.1:9090/"
                      "proxies/" +
                      encoded +
                      "/delay"
                      "?timeout=5000"
                      "&url=https://www.gstatic.com/generate_204"
                  )

                  req = urllib.request.Request(
                      url,
                      method="GET"
                  )

                  with urllib.request.urlopen(
                      req,
                      timeout=8
                  ) as r:

                      result = json.loads(
                          r.read().decode(
                              "utf-8"
                          )
                      )

                  delay = result.get(
                      "delay",
                      0
                  )

                  if delay and delay > 0:

                      results.append({
                          "name": name,
                          "delay": delay
                      })

                      print(
                          f"[{index}/{len(names)}] "
                          f"{delay} ms "
                          f"{name}"
                      )

              except Exception:
                  pass

          results.sort(
              key=lambda x: x["delay"]
          )

          with open(
              "tested-nodes.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  results,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print(
              "實測可用：",
              len(results)
          )

          print()
          print("最快 20 個：")

          for i, item in enumerate(
              results[:20],
              1
          ):

              print(
                  f"{i:02d}. "
                  f"{item['delay']} ms"
              )

          if len(results) < 5:
              raise SystemExit(
                  "實測可用節點少於 5 個，停止更新"
              )

          PY


      # ============================================================
      # 10. 建立優選 Clash
      # ============================================================
      - name: Build optimized Clash
        run: |
          set -e

          python3 - <<'PY'
          import json
          import yaml

          with open(
              "mihomo.yaml",
              "r",
              encoding="utf-8"
          ) as f:

              source = yaml.safe_load(f)

          with open(
              "tested-nodes.json",
              "r",
              encoding="utf-8"
          ) as f:

              tested = json.load(f)

          best = tested[:100]

          wanted = {
              x["name"]
              for x in best
          }

          proxies = []

          for proxy in source.get(
              "proxies",
              []
          ):

              if proxy.get("name") in wanted:
                  proxies.append(proxy)

          print(
              "優選節點：",
              len(proxies)
          )

          if len(proxies) < 5:
              raise SystemExit(
                  "優選後節點不足"
              )

          optimized = {
              "proxies": proxies
          }

          with open(
              "optimized.yaml",
              "w",
              encoding="utf-8"
          ) as f:

              yaml.safe_dump(
                  optimized,
                  f,
                  allow_unicode=True,
                  sort_keys=False
              )

          PY


      # ============================================================
      # 11. 優選 Clash → Shadowrocket
      # ============================================================
      - name: Convert optimized Clash to Shadowrocket
        run: |
          set -e

          echo "啟動第二個本機文件服務"

          mkdir -p optimized-server

          cp optimized.yaml optimized-server/

          cd optimized-server

          python3 -m http.server 8001 \
            --bind 127.0.0.1 \
            > ../optimized-http.log 2>&1 &

          echo $! > ../optimized-http.pid

          cd ..

          sleep 2

          curl -fsS \
            http://127.0.0.1:8001/optimized.yaml \
            -o /tmp/check-optimized.yaml

          echo "開始轉換 Shadowrocket"

          curl -fsS \
            --max-time 180 \
            "http://127.0.0.1:25500/sub?target=v2ray&url=http://127.0.0.1:8001/optimized.yaml&emoji=false" \
            -o sub.txt

          if [ ! -s sub.txt ]; then
            echo "Shadowrocket 訂閱為空"
            exit 1
          fi

          FINAL=$(grep -c '://' sub.txt || true)

          echo "最終訂閱節點：$FINAL"

          if [ "$FINAL" -lt 5 ]; then
            echo "最終訂閱少於 5 個節點"
            exit 1
          fi


      # ============================================================
      # 12. 建立更新報告
      # ============================================================
      - name: Build report
        run: |
          set -e

          TESTED=$(python3 - <<'PY'
          import json

          with open(
              "tested-nodes.json",
              "r",
              encoding="utf-8"
          ) as f:

              print(
                  len(json.load(f))
              )
          PY
          )

          FINAL=$(grep -c '://' sub.txt || true)

          NOW=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          cat > daily-report.md <<EOF
          # Daily Node Update

          最後成功更新：$NOW

          更新週期：每 8 小時

          抓取來源：8

          抓取節點：$total

          去重後：$UNIQUE

          實測可用：$TESTED

          最終優選：$FINAL

          優選方式：
          mihomo 實際測試延遲。

          測試地址：
          https://www.gstatic.com/generate_204

          訂閱地址保持不變。
          EOF

          cat daily-report.md


      # ============================================================
      # 13. 保存訂閱
      # ============================================================
      - name: Save subscription
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            sub.txt \
            daily-report.md

          if git diff --cached --quiet; then

            echo "訂閱內容沒有變化"

          else

            git commit \
              -m "Auto optimize nodes"

            git push

          fi
