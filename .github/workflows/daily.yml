name: Daily Node Update

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Download nodes
        run: |

          rm -f all.txt unique.txt final.txt sub.txt clash.yaml


          curl -L -s \
          https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/nodes.txt \
          >> all.txt || true


          curl -L -s \
          https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt \
          >> all.txt || true


          curl -L -s \
          https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.txt \
          >> all.txt || true


          curl -L -s \
          https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub \
          >> all.txt || true


          grep -Eo '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^ "<>]+' \
          all.txt \
          | sort -u \
          > unique.txt


          echo "原始節點:"
          wc -l unique.txt



      - name: Test node speed
        run: |

          python3 <<'PY'

import socket
import concurrent.futures
import urllib.parse


nodes=[]

with open("unique.txt","r",encoding="utf-8") as f:
    for line in f:
        line=line.strip()
        if line:
            nodes.append(line)


def test(node):

    try:

        u=urllib.parse.urlparse(node)

        host=u.hostname
        port=u.port

        if not host or not port:
            return None


        start=__import__("time").time()

        s=socket.socket()
        s.settimeout(3)

        s.connect((host,port))

        delay=int((__import__("time").time()-start)*1000)

        s.close()

        return (delay,node)

    except:

        return None



result=[]


with concurrent.futures.ThreadPoolExecutor(max_workers=100) as exe:

    for r in exe.map(test,nodes):

        if r:
            result.append(r)



result.sort(key=lambda x:x[0])


print("有效節點:",len(result))


with open("final.txt","w",encoding="utf-8") as f:

    for delay,node in result[:100]:

        f.write(node+"\n")


PY


          echo "最終節點:"
          wc -l final.txt




      - name: Build Shadowrocket subscription
        run: |

          base64 -w 0 final.txt > sub.txt

          echo >> sub.txt



      - name: Save
        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"


          git add sub.txt


          git commit -m "auto update nodes" || true


          git push
