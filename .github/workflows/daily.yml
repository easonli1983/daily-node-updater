name: Daily Node Update

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip curl


    - name: Fetch nodes
      run: |

        rm -f all.txt

        urls=(

        "https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/nodes.txt"

        "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt"

        "https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.txt"

        "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub"

        )


        for url in "${urls[@]}"
        do

          echo "抓取 $url"

          curl -L \
          --connect-timeout 10 \
          --max-time 30 \
          -s "$url" >> all.txt || true

        done



        grep -Eo \
        '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^" <>()]+' \
        all.txt \
        | sort -u \
        > unique.txt



        count=$(wc -l < unique.txt)

        echo "節點數 $count"



        if [ "$count" -lt 10 ]
        then

          echo "節點不足"

          exit 1

        fi



    - name: Random test 200 nodes
      run: |

        shuf -n 200 unique.txt > test.txt



    - name: Speed test
      run: |

        python3 <<'PY'

        import socket
        import time
        import random


        nodes=[]


        with open("test.txt") as f:

            nodes=[
                x.strip()
                for x in f
                if x.strip()
            ]


        result=[]


        for i,node in enumerate(nodes):

            start=time.time()


            try:

                host=node.split("://")[1].split(":")[0]

                socket.setdefaulttimeout(3)

                socket.gethostbyname(host)


                delay=int(
                    (time.time()-start)*1000
                )


                if delay < 3000:

                    result.append(
                        (delay,node)
                    )


            except:

                pass


            print(
                i,
                "完成"
            )


        result.sort(
            key=lambda x:x[0]
        )


        result=result[:100]


        with open(
            "best.txt",
            "w"
        ) as f:


            for delay,node in result:

                f.write(
                    node+"\n"
                )


        print(
            "保留",
            len(result)
        )


        if len(result)<5:

            raise Exception(
                "有效節點太少"
            )


        PY



    - name: Build subscription
      run: |

        base64 -w 0 best.txt > sub.txt

        echo >> sub.txt



    - name: Report
      run: |

        cat > daily-report.md <<EOF

# Daily Node Update


更新時間：

$(date -u)


狀態：

成功


保留節點：

$(wc -l < best.txt)


訂閱：

https://twit2er.github.io/daily-node-updater/sub.txt


EOF



    - name: Commit

      run: |

        git config user.name github-actions

        git config user.email github-actions@github.com


        git add sub.txt daily-report.md


        git commit -m "auto update nodes" || exit 0


        git push



    - name: Telegram

      if: success()

      run: |

        python3 <<'PY'

        import os
        import urllib.request
        import urllib.parse


        token=os.environ["TOKEN"]

        chat=os.environ["CHAT"]


        text="""

🟢 节点自动更新完成


时间:

%s


节点:

%s 个


""" % (

        __import__("datetime").datetime.now(),

        open("best.txt").read().count("\n")

        )


        url=f"https://api.telegram.org/bot{token}/sendMessage"


        data=urllib.parse.urlencode({

        "chat_id":chat,

        "text":text

        }).encode()


        urllib.request.urlopen(

        urllib.request.Request(
            url,
            data=data
        )

        )


        PY


      env:

        TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

        CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
