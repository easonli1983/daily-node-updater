name: Daily Update

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate report
        run: |
          echo "# Daily Update" > daily-report.md
          echo "" >> daily-report.md
          echo "更新时间（UTC）：" >> daily-report.md
          date -u >> daily-report.md
          echo "" >> daily-report.md
          echo "## 来源" >> daily-report.md
          cat sources.txt >> daily-report.md

      - name: Save report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-report.md
          git diff --cached --quiet || git commit -m "Update daily report"
          git push
