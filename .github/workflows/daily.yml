```yaml
name: Node Auto Optimizer

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. 安裝工具
      # ============================================================
      - name: Install tools
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y curl jq python3 python3-yaml

          echo "安裝 subconverter"

          docker pull ghcr.io/metacubex/subconverter:latest

          echo "下載 mihomo"

          MIHOMO_VERSION="v1.19.29"

          curl -L \
            --fail \
            --retry 3 \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz" \
            -o mihomo.gz

          gunzip -f mihomo.gz

          chmod +x mihomo

          ./mihomo -v


      # ============================================================
      # 3. 抓取節點
      # ============================================================
      - name: Fetch nodes
        run: |
          set -e

          rm -f all-nodes.txt
          rm -f unique-nodes.txt
          rm -f sub.txt
          rm -f clash.yaml
          rm -f optimized.yaml
          rm -f tested-nodes.json
          rm -f daily-report.md

          SOURCES=(
            "https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/nodes.txt"
            "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt"
            "https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.txt"
            "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/clash.yml"
            "https://cdn.jsdelivr.net/gh/vxiaov/free_proxies@main/clash/clash.provider.yaml"
            "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub"
            "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.yml"
            "https://raw.githubusercontent.com/ts-sf/fly/main/clash"
          )

          total=0
          success=0
          failed=0
          index=0

          echo "================================"
          echo "開始抓取節點"
          echo "================================"

          touch all-nodes.txt

          for url in "${SOURCES[@]}"; do

            index=$((index + 1))

            echo
            echo "[$index/${#SOURCES[@]}]"
            echo "$url"

            tmp="source-${index}.txt"

            if curl -L \
              --fail \
              --connect-timeout 10 \
              --max-time 40 \
              --retry 2 \
              --retry-delay 2 \
              -A "Mozilla/5.0" \
              -sS \
              "$url" \
              -o "$tmp"; then

              count=$(grep -Eo \
                '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                "$tmp" 2>/dev/null | wc -l)

              if [ "$count" -gt 0 ]; then

                echo "識別到 $count 個 URI 節點"

                grep -Eo \
                  '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                  "$tmp" >> all-nodes.txt

                total=$((total + count))
                success=$((success + 1))

              else

                echo "沒有識別到 URI 節點"

              fi

            else

              echo "來源抓取失敗"
              failed=$((failed + 1))

            fi

            rm -f "$tmp"

          done

          echo
          echo "================================"
          echo "抓取完成"
          echo "================================"

          echo "來源：${#SOURCES[@]}"
          echo "成功：$success"
          echo "失敗：$failed"
          echo "抓取節點：$total"

          if [ ! -s all-nodes.txt ]; then
            echo "沒有抓取到任何節點"
            exit 1
          fi

          sort -u all-nodes.txt > unique-nodes.txt

          UNIQUE=$(wc -l < unique-nodes.txt)

          echo "去重後節點：$UNIQUE"

          if [ "$UNIQUE" -lt 5 ]; then
            echo "去重後節點少於 5 個，停止更新"
            exit 1
          fi


      # ============================================================
      # 4. 啟動 subconverter
      #
      # 關鍵修正：
      # 不再把所有節點塞進 URL 參數。
      #
      # 而是把 GitHub Actions 工作目錄掛載到容器：
      #
      # /workspace/unique-nodes.txt
      #
      # subconverter 直接讀取這個文件。
      # ============================================================
      - name: Start subconverter
        run: |
          set -e

          docker rm -f subconverter 2>/dev/null || true

          docker run -d \
            --name subconverter \
            -p 25500:25500 \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            ghcr.io/metacubex/subconverter:latest

          echo "等待 subconverter 啟動"

          for i in $(seq 1 30); do

            if curl -fsS \
              http://127.0.0.1:25500/version \
              > /dev/null 2>&1; then

              echo "subconverter 已啟動"
              break

            fi

            sleep 2

          done

          curl -fsS \
            http://127.0.0.1:25500/version

          echo


      # ============================================================
      # 5. URI → Clash
      #
      # 使用文件，不使用超長 URL。
      # ============================================================
      - name: Convert nodes to Clash
        run: |
          set -e

          echo "開始把節點轉成 Clash"

          echo "輸入文件："
          echo "${GITHUB_WORKSPACE}/unique-nodes.txt"

          curl -fsS \
            --max-time 180 \
            "http://127.0.0.1:25500/sub?target=clash&url=file:///workspace/unique-nodes.txt&emoji=false" \
            -o clash.yaml

          echo
          echo "Clash 配置生成完成"

          if [ ! -s clash.yaml ]; then
            echo "Clash 配置為空"
            exit 1
          fi

          grep -q "^proxies:" clash.yaml

          python3 - <<'PY'
          import yaml

          with open("clash.yaml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          proxies = data.get("proxies", [])

          print("Clash 節點數：", len(proxies))

          if len(proxies) < 5:
              raise SystemExit("Clash 節點少於 5 個，停止更新")
          PY


      # ============================================================
      # 6. 建立 mihomo 配置
      # ============================================================
      - name: Build mihomo config
        run: |
          set -e

          python3 - <<'PY'
          import yaml

          with open("clash.yaml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          proxies = data.get("proxies", [])

          clean = []

          for i, proxy in enumerate(proxies):

              if not isinstance(proxy, dict):
                  continue

              if not proxy.get("name"):
                  proxy["name"] = f"node-{i}"

              clean.append(proxy)

          if len(clean) < 5:
              raise SystemExit("有效 Clash 節點少於 5 個")

          data["proxies"] = clean

          data["mixed-port"] = 7890

          data["external-controller"] = "127.0.0.1:9090"

          data["secret"] = ""

          with open("mihomo.yaml", "w", encoding="utf-8") as f:
              yaml.safe_dump(
                  data,
                  f,
                  allow_unicode=True,
                  sort_keys=False
              )

          print("mihomo 配置完成")
          print("測試節點：", len(clean))
          PY


      # ============================================================
      # 7. 啟動 mihomo
      # ============================================================
      - name: Start mihomo
        run: |
          set -e

          mkdir -p mihomo-data

          ./mihomo \
            -d ./mihomo-data \
            -f ./mihomo.yaml \
            > mihomo.log 2>&1 &

          echo $! > mihomo.pid

          echo "等待 mihomo 啟動"

          READY=0

          for i in $(seq 1 30); do

            if curl -fsS \
              http://127.0.0.1:9090/version \
              > /dev/null 2>&1; then

              READY=1
              echo "mihomo 已啟動"
              break

            fi

            sleep 2

          done

          if [ "$READY" -ne 1 ]; then
            echo "mihomo 啟動失敗"
            cat mihomo.log
            exit 1
          fi

          curl -fsS \
            http://127.0.0.1:9090/version


      # ============================================================
      # 8. 實際逐個測試節點
      #
      # 這裡不依賴 url-test group。
      #
      # 直接要求 mihomo 對每一個節點做延遲測試。
      # ============================================================
      - name: Test nodes
        run: |
          set -e

          echo
          echo "================================"
          echo "開始實際測試節點"
          echo "================================"

          python3 - <<'PY'
          import yaml
          import json
          import urllib.request
          import urllib.parse
          import urllib.error
          import time

          with open("clash.yaml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          proxies = data.get("proxies", [])

          print("待測試節點：", len(proxies))

          results = []

          test_url = "https://www.gstatic.com/generate_204"

          for index, proxy in enumerate(proxies, 1):

              name = proxy.get("name")

              if not name:
                  continue

              encoded_name = urllib.parse.quote(
                  name,
                  safe=""
              )

              api = (
                  "http://127.0.0.1:9090/proxies/"
                  + encoded_name
                  + "/delay?"
                  + urllib.parse.urlencode({
                      "url": test_url,
                      "timeout": "8000"
                  })
              )

              try:

                  req = urllib.request.Request(
                      api,
                      method="GET"
                  )

                  with urllib.request.urlopen(
                      req,
                      timeout=12
                  ) as response:

                      body = json.loads(
                          response.read().decode("utf-8")
                      )

                  delay = body.get("delay", 0)

                  if isinstance(delay, int) and delay > 0:

                      results.append({
                          "name": name,
                          "delay": delay
                      })

                      print(
                          f"[{index}/{len(proxies)}] "
                          f"OK {delay} ms "
                          f"{name}"
                      )

                  else:

                      print(
                          f"[{index}/{len(proxies)}] "
                          f"FAIL {name}"
                      )

              except Exception as e:

                  print(
                      f"[{index}/{len(proxies)}] "
                      f"FAIL {name}"
                  )

          results.sort(
              key=lambda x: x["delay"]
          )

          with open(
              "tested-nodes.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  results,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print("================================")
          print("測試完成")
          print("================================")

          print("實測可用：", len(results))

          print()
          print("最快 20 個：")

          for i, item in enumerate(
              results[:20],
              1
          ):

              print(
                  f"{i:02d}. "
                  f"{item['delay']} ms"
              )

          if len(results) < 5:
              raise SystemExit(
                  "實測可用節點少於 5 個，停止更新，保護舊訂閱。"
              )
          PY


      # ============================================================
      # 9. 建立優選 Clash
      # ============================================================
      - name: Build optimized Clash
        run: |
          set -e

          python3 - <<'PY'
          import yaml
          import json

          with open(
              "clash.yaml",
              "r",
              encoding="utf-8"
          ) as f:

              source = yaml.safe_load(f)

          with open(
              "tested-nodes.json",
              "r",
              encoding="utf-8"
          ) as f:

              tested = json.load(f)

          best = tested[:100]

          wanted = {
              item["name"]
              for item in best
          }

          proxies = []

          for proxy in source.get(
              "proxies",
              []
          ):

              if proxy.get("name") in wanted:
                  proxies.append(proxy)

          if not proxies:
              raise SystemExit(
                  "優選後沒有節點"
              )

          result = {
              "proxies": proxies
          }

          with open(
              "optimized.yaml",
              "w",
              encoding="utf-8"
          ) as f:

              yaml.safe_dump(
                  result,
                  f,
                  allow_unicode=True,
                  sort_keys=False
              )

          print(
              "最終優選節點：",
              len(proxies)
          )
          PY


      # ============================================================
      # 10. 優選 Clash → Shadowrocket
      #
      # 同樣使用文件，不再建立超長 URL。
      # ============================================================
      - name: Build Shadowrocket subscription
        run: |
          set -e

          echo "開始生成 Shadowrocket 訂閱"

          curl -fsS \
            --max-time 180 \
            "http://127.0.0.1:25500/sub?target=v2ray&url=file:///workspace/optimized.yaml&emoji=false" \
            -o sub.txt

          if [ ! -s sub.txt ]; then
            echo "Shadowrocket 訂閱生成失敗"
            exit 1
          fi

          FINAL=$(grep -cve '^[[:space:]]*$' sub.txt || true)

          echo
          echo "================================"
          echo "Shadowrocket 訂閱完成"
          echo "================================"

          echo "最終節點：$FINAL"

          if [ "$FINAL" -lt 5 ]; then
            echo "最終訂閱少於 5 個節點"
            exit 1
          fi


      # ============================================================
      # 11. 建立更新報告
      # ============================================================
      - name: Build report
        run: |
          set -e

          TOTAL=$(grep -Ec \
            '^(vmess|vless|trojan|ss|hysteria2|hysteria)://' \
            all-nodes.txt || true)

          UNIQUE=$(wc -l < unique-nodes.txt)

          TESTED=$(python3 - <<'PY'
          import json

          with open(
              "tested-nodes.json",
              "r",
              encoding="utf-8"
          ) as f:
              print(len(json.load(f)))
          PY
          )

          FINAL=$(grep -cve '^[[:space:]]*$' sub.txt || true)

          cat > daily-report.md <<EOF
          # Daily Node Update

          檢測時間：$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          - 更新週期：每 8 小時
          - 原始抓取節點：$TOTAL
          - 去重後：$UNIQUE
          - 實測可用：$TESTED
          - 最終優選：$FINAL

          ## 優選方式

          使用 mihomo 對節點逐一進行實際延遲測試。

          測試地址：

          https://www.gstatic.com/generate_204

          按實際延遲由低到高排序。

          最多保留 100 個可用節點。

          本次更新成功後覆蓋 sub.txt。

          ## Shadowrocket 訂閱地址

          https://twit2er.github.io/daily-node-updater/sub.txt
          EOF

          cat daily-report.md


      # ============================================================
      # 12. 保存新的訂閱
      #
      # 注意：
      # 這裡不再發郵件。
      # 也不再發 Telegram。
      #
      # GitHub Actions 每 8 小時只負責更新訂閱文件。
      # ============================================================
      - name: Save subscription
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            sub.txt \
            daily-report.md

          if git diff --cached --quiet; then

            echo "沒有內容變化"

          else

            git commit \
              -m "Update optimized node subscription"

            git push

          fi


      # ============================================================
      # 13. 完成
      # ============================================================
      - name: Done
        if: success()
        run: |
          echo "================================"
          echo "8 小時節點優選更新完成"
          echo "================================"

          echo "訂閱文件：sub.txt"

          echo "GitHub Pages："
          echo "https://twit2er.github.io/daily-node-updater/sub.txt"
```
