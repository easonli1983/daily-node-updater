name: Daily Node Update

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch nodes, test and build subscription
        run: |
          set +e

          rm -f all-nodes.txt unique-nodes.txt candidates.txt sub.txt daily-report.md

          SOURCES=(
            "https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/nodes.txt"
            "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt"
            "https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.txt"
            "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/clash.yml"
            "https://cdn.jsdelivr.net/gh/vxiaov/free_proxies@main/clash/clash.provider.yaml"
            "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub"
            "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.yml"
            "https://raw.githubusercontent.com/ts-sf/fly/main/clash"
          )

          total=0
          success=0
          failed=0
          index=0

          echo "================================"
          echo "開始獲取節點"
          echo "================================"

          for url in "${SOURCES[@]}"; do
            index=$((index + 1))

            echo
            echo "[$index/${#SOURCES[@]}]"
            echo "正在獲取：$url"

            tmp="source-$index.txt"

            curl -L \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 2 \
              --retry-delay 2 \
              -A "Mozilla/5.0" \
              -sS \
              -o "$tmp" \
              -w "%{http_code}" \
              "$url" > "status-$index.txt" 2>/dev/null

            status=$(cat "status-$index.txt")

            if [ "$status" = "200" ]; then
              echo "HTTP 200"

              count=$(grep -Eo \
                '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                "$tmp" | wc -l)

              if [ "$count" -gt 0 ]; then
                echo "識別到 $count 個節點"

                grep -Eo \
                  '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                  "$tmp" >> all-nodes.txt

                total=$((total + count))
                success=$((success + 1))
              else
                echo "可以訪問，但沒有識別到明文節點"
              fi
            else
              echo "HTTP $status，跳過"
              failed=$((failed + 1))
            fi

            rm -f "$tmp" "status-$index.txt"
          done

          echo
          echo "================================"
          echo "源統計"
          echo "================================"
          echo "總來源：${#SOURCES[@]}"
          echo "成功來源：$success"
          echo "失敗來源：$failed"
          echo "抓取節點：$total"

          if [ ! -s all-nodes.txt ]; then
            echo "沒有獲取到節點"
            exit 1
          fi

          # ========================================
          # 第一步：去重
          # ========================================

          sort -u all-nodes.txt > unique-nodes.txt

          unique=$(wc -l < unique-nodes.txt)

          echo
          echo "去重後節點：$unique"

          # ========================================
          # 第二步：基礎格式篩選
          # ========================================

          grep -E \
            '^(vmess|vless|trojan|ss|hysteria2|hysteria)://' \
            unique-nodes.txt \
            > candidates.txt

          candidate_count=$(wc -l < candidates.txt)

          echo "格式有效節點：$candidate_count"

          if [ "$candidate_count" -eq 0 ]; then
            echo "沒有格式有效節點"
            exit 1
          fi

          # ========================================
          # 第三步：節點連通性預檢
          #
          # 不直接測試代理是否能翻牆。
          # 這一步只排除：
          # - 明顯損壞
          # - 無法解析的域名
          # - 明顯不可連接的地址
          #
          # 避免一次測試數千節點造成 GitHub Actions
          # 運行時間過長。
          # ========================================

          rm -f tested-nodes.txt

          echo
          echo "================================"
          echo "開始節點預檢"
          echo "================================"

          python - <<'PY'
          import re
          import socket
          import urllib.parse

          input_file = "candidates.txt"
          output_file = "tested-nodes.txt"

          protocols = {
              "vmess",
              "vless",
              "trojan",
              "ss",
              "hysteria",
              "hysteria2"
          }

          def extract_host_port(node):
              try:
                  scheme = node.split("://", 1)[0].lower()

                  if scheme not in protocols:
                      return None, None

                  body = node.split("://", 1)[1]

                  if scheme == "vmess":
                      return None, None

                  if "@" in body:
                      body = body.rsplit("@", 1)[1]

                  body = body.split("?", 1)[0]
                  body = body.split("#", 1)[0]

                  if body.startswith("["):
                      end = body.find("]")
                      if end == -1:
                          return None, None

                      host = body[1:end]

                      if len(body) > end + 1 and body[end + 1] == ":":
                          port = body[end + 2:]
                      else:
                          port = ""

                  else:
                      if ":" not in body:
                          return None, None

                      host, port = body.rsplit(":", 1)

                  if not host or not port.isdigit():
                      return None, None

                  port = int(port)

                  if port < 1 or port > 65535:
                      return None, None

                  return host, port

              except Exception:
                  return None, None

          total = 0
          valid = 0
          checked = 0

          with open(input_file, "r", encoding="utf-8", errors="ignore") as f:
              nodes = [x.strip() for x in f if x.strip()]

          with open(output_file, "w", encoding="utf-8") as out:
              for node in nodes:
                  total += 1

                  host, port = extract_host_port(node)

                  # vmess 等部分格式可能需要 Base64/JSON
                  # 無法直接解析時先保留，交給後續使用。
                  if host is None:
                      if node.startswith("vmess://"):
                          out.write(node + "\n")
                          valid += 1
                      continue

                  try:
                      socket.getaddrinfo(
                          host,
                          port,
                          type=socket.SOCK_STREAM
                      )

                      valid += 1
                      out.write(node + "\n")

                  except Exception:
                      pass

                  checked += 1

          print("格式節點：", total)
          print("預檢保留：", valid)
          print("完成。")
          PY

          if [ ! -s tested-nodes.txt ]; then
            echo "預檢後沒有可用節點"
            exit 1
          fi

          tested=$(wc -l < tested-nodes.txt)

          echo
          echo "預檢後節點：$tested"

          # ========================================
          # 第四步：建立優選候選池
          #
          # 不直接 head 100。
          # 先打亂節點順序，避免每次永遠選中同一批
          # 來源靠前的節點。
          # ========================================

          shuf tested-nodes.txt > shuffled-nodes.txt

          # 候選池最多 300 個
          head -n 300 shuffled-nodes.txt > candidates-final.txt

          candidate_final=$(wc -l < candidates-final.txt)

          echo "優選候選池：$candidate_final"

          # ========================================
          # 第五步：最終選擇 100 個
          # ========================================

          head -n 100 candidates-final.txt > sub.txt

          final=$(wc -l < sub.txt)

          echo
          echo "================================"
          echo "最終結果"
          echo "================================"
          echo "總來源：${#SOURCES[@]}"
          echo "成功來源：$success"
          echo "失敗來源：$failed"
          echo "抓取節點：$total"
          echo "去重後：$unique"
          echo "格式有效：$candidate_count"
          echo "預檢後：$tested"
          echo "候選池：$candidate_final"
          echo "最終節點：$final"

          if [ "$final" -lt 20 ]; then
            echo "最終可用節點過少，停止更新"
            exit 1
          fi

          # ========================================
          # 生成報告
          # ========================================

          cat > daily-report.md <<EOF
          Daily Node Update

          檢測時間：$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          總來源：${#SOURCES[@]}
          成功來源：$success
          失敗來源：$failed

          抓取節點：$total
          去重後：$unique
          格式有效：$candidate_count
          預檢後：$tested
          候選池：$candidate_final
          最終節點：$final

          Shadowrocket 訂閱地址：

          https://twit2er.github.io/daily-node-updater/sub.txt
          EOF

          echo
          echo "================================"
          echo "生成完成"
          echo "================================"

      - name: Send email
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          with open("daily-report.md", "r", encoding="utf-8") as f:
              report = f.read()

          with open("sub.txt", "r", encoding="utf-8") as f:
              nodes = [x.strip() for x in f if x.strip()]

          email = os.environ.get("EMAIL", "").strip()
          api_key = os.environ.get("RESEND_API_KEY", "").strip()

          print("================================")
          print("準備發送郵件")
          print("================================")
          print("節點數量：", len(nodes))
          print("EMAIL Secret：", "已設置" if email else "未設置")
          print(
              "RESEND_API_KEY：",
              "已設置" if api_key else "未設置"
          )

          if not email or not api_key:
              print("郵件配置不完整，跳過")
              raise SystemExit(0)

          html = f"""
          <h2>Daily Node Update</h2>

          <p>節點檢測已完成。</p>

          <ul>
            <li>最終節點：{len(nodes)}</li>
          </ul>

          <p>
          <a href="https://twit2er.github.io/daily-node-updater/sub.txt">
          Shadowrocket 訂閱地址
          </a>
          </p>

          <hr>

          <pre>{report}</pre>
          """

          data = {
              "from": "Daily Update <onboarding@resend.dev>",
              "to": [email],
              "subject": "Daily Update｜節點訂閱更新",
              "html": html
          }

          req = urllib.request.Request(
              "https://api.resend.com/emails",
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + api_key,
                  "Content-Type": "application/json",
                  "User-Agent": "daily-node-updater/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  print("郵件發送成功")
                  print(response.read().decode("utf-8"))

          except urllib.error.HTTPError as e:
              print("Resend HTTP 錯誤：", e.code)
              print(
                  e.read().decode(
                      "utf-8",
                      errors="replace"
                  )
              )

          except Exception as e:
              print("郵件發送失敗：", repr(e))
          PY

        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL: ${{ secrets.EMAIL }}

      - name: Save subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sub.txt daily-report.md

          git diff --cached --quiet || \
            git commit -m "Update node subscription"

          git push
