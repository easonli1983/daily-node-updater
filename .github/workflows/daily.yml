name: Daily Update

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          sources_file = "sources.txt"
          report_file = "daily-report.md"

          sources = []

          with open(sources_file, "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if line and not line.startswith("#"):
                      sources.append(line)

          now = datetime.now(timezone.utc)

          report = []
          report.append("# Daily Update")
          report.append("")
          report.append(f"检查时间（UTC）：{now.strftime('%Y-%m-%d %H:%M:%S')}")
          report.append("")

          for repo in sources:
              url = f"https://api.github.com/repos/{repo}/releases/latest"

              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "daily-node-updater/1.0"
                  }
              )

              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      data = json.loads(response.read().decode("utf-8"))

                  tag = data.get("tag_name", "无")
                  name = data.get("name", "无标题")
                  published = data.get("published_at", "未知")
                  html_url = data.get(
                      "html_url",
                      f"https://github.com/{repo}/releases"
                  )

                  report.append(f"## {repo}")
                  report.append(f"- 最新版本：{tag}")
                  report.append(f"- 发布时间：{published}")
                  report.append(f"- 标题：{name}")
                  report.append(f"- 地址：{html_url}")
                  report.append("")

              except Exception as e:
                  report.append(f"## {repo}")
                  report.append(f"- 检查失败：{e}")
                  report.append("")

          with open(report_file, "w", encoding="utf-8") as f:
              f.write("\n".join(report))

          print("\n".join(report))
          PY

      - name: Send email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          with open("daily-report.md", "r", encoding="utf-8") as f:
              report = f.read()

          html = report.replace("\n", "<br>")

          data = {
              "from": "Daily Update <onboarding@resend.dev>",
              "to": ["你的Gmail地址"],
              "subject": "Daily Update｜GitHub 更新检查",
              "html": f"""
              <h2>GitHub 每日更新</h2>
              <p>{html}</p>
              """
          }

          req = urllib.request.Request(
              "https://api.resend.com/emails",
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + os.environ["RESEND_API_KEY"],
                  "Content-Type": "application/json",
                  "User-Agent": "daily-node-updater/1.0"
              },
              method="POST"
          )

          with urllib.request.urlopen(req) as response:
              print(response.read().decode("utf-8"))
          PY

      - name: Save report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-report.md
          git diff --cached --quiet || git commit -m "Update daily report"
          git push
