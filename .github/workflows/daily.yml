name: Daily Update

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check GitHub releases
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.error

          sources_file = "sources.txt"
          state_file = "release-state.json"
          report_file = "daily-report.md"

          sources = []

          with open(sources_file, "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if line and not line.startswith("#"):
                      sources.append(line)

          if os.path.exists(state_file):
              with open(state_file, "r", encoding="utf-8") as f:
                  state = json.load(f)
          else:
              state = {}

          updates = []
          new_state = dict(state)

          for repo in sources:
              url = f"https://api.github.com/repos/{repo}/releases/latest"

              success = False

              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "Accept": "application/vnd.github+json",
                              "User-Agent": "daily-node-updater/1.0"
                          }
                      )

                      with urllib.request.urlopen(req, timeout=20) as response:
                          data = json.loads(
                              response.read().decode("utf-8")
                          )

                      success = True
                      break

                  except urllib.error.HTTPError as e:
                      print(
                          f"{repo} 第 {attempt}/3 次请求失败：HTTP {e.code}"
                      )

                      if attempt < 3:
                          time.sleep(attempt * 5)

                  except Exception as e:
                      print(
                          f"{repo} 第 {attempt}/3 次请求失败：{e}"
                      )

                      if attempt < 3:
                          time.sleep(attempt * 5)

              if not success:
                  print(
                      f"检查 {repo} 失败：3 次请求全部失败，跳过本次检查。"
                  )
                  continue

              tag = data.get("tag_name", "")
              name = data.get("name", "")
              published = data.get("published_at", "")
              html_url = data.get(
                  "html_url",
                  f"https://github.com/{repo}/releases"
              )

              old_tag = state.get(repo)

              if old_tag is None:
                  new_state[repo] = tag
                  continue

              if tag != old_tag:
                  updates.append({
                      "repo": repo,
                      "old": old_tag,
                      "new": tag,
                      "name": name,
                      "published": published,
                      "url": html_url
                  })

                  new_state[repo] = tag

          with open(state_file, "w", encoding="utf-8") as f:
              json.dump(
                  new_state,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          if updates:
              report = [
                  "# GitHub 新版本更新",
                  ""
              ]

              for item in updates:
                  report.append(
                      f"## {item['repo']}"
                  )
                  report.append(
                      f"- 原版本：{item['old']}"
                  )
                  report.append(
                      f"- 新版本：{item['new']}"
                  )
                  report.append(
                      f"- 标题：{item['name']}"
                  )
                  report.append(
                      f"- 发布时间：{item['published']}"
                  )
                  report.append(
                      f"- Release：{item['url']}"
                  )
                  report.append("")

              with open(
                  report_file,
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write("\n".join(report))

              print("发现新版本，需要发送邮件。")
              print("\n".join(report))

              with open(
                  "send-email.txt",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write("yes")

          else:
              print("没有发现新版本，不发送邮件。")

              with open(
                  "send-email.txt",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write("no")
          PY

      - name: Send email if there is an update
        run: |
          if [ "$(cat send-email.txt)" != "yes" ]; then
            echo "没有新版本，不发送邮件。"
            exit 0
          fi

          python - <<'PY'
          import os
          import json
          import urllib.request

          with open(
              "daily-report.md",
              "r",
              encoding="utf-8"
          ) as f:
              report = f.read()

          html = report.replace("\n", "<br>")

          data = {
              "from": "Daily Update <onboarding@resend.dev>",
              "to": ["openmysee@gmail.com"],
              "subject": "Daily Update｜发现新版本",
              "html": f"""
              <h2>GitHub 有新版本</h2>
              <p>{html}</p>
              """
          }

          req = urllib.request.Request(
              "https://api.resend.com/emails",
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + os.environ["RESEND_API_KEY"],
                  "Content-Type": "application/json",
                  "User-Agent": "daily-node-updater/1.0"
              },
              method="POST"
          )

          with urllib.request.urlopen(req) as response:
              print(
                  response.read().decode("utf-8")
              )
          PY

        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-state.json
          git diff --cached --quiet || git commit -m "Update release state"
          git push
