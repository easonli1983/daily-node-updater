name: Node Auto Optimizer

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. 安裝基本工具
      # 不再安裝 Docker / containerd
      # GitHub Runner 本身已經有 Docker
      # ============================================================
      - name: Install tools
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y curl jq python3 python3-yaml

          echo "Docker 版本："
          docker --version

          echo "Python 版本："
          python3 --version


      # ============================================================
      # 3. 抓取所有公開節點
      # ============================================================
      - name: Fetch nodes
        run: |
          set -e

          rm -f all-nodes.txt
          rm -f unique-nodes.txt
          rm -f source-*.txt

          SOURCES=(
            "https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/nodes.txt"
            "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt"
            "https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.txt"
            "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/clash.yml"
            "https://cdn.jsdelivr.net/gh/vxiaov/free_proxies@main/clash/clash.provider.yaml"
            "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub"
            "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.yml"
            "https://raw.githubusercontent.com/ts-sf/fly/main/clash"
          )

          total=0
          success=0
          failed=0
          index=0

          echo "================================"
          echo "開始抓取節點"
          echo "================================"

          for url in "${SOURCES[@]}"; do

            index=$((index + 1))

            echo
            echo "[$index/${#SOURCES[@]}]"
            echo "$url"

            tmp="source-${index}.txt"

            if curl -L \
              --connect-timeout 10 \
              --max-time 40 \
              --retry 2 \
              --retry-delay 2 \
              -A "Mozilla/5.0" \
              -sS \
              -o "$tmp" \
              "$url"; then

              count=$(grep -Eo \
                '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                "$tmp" 2>/dev/null | wc -l)

              if [ "$count" -gt 0 ]; then

                echo "識別到 $count 個節點"

                grep -Eo \
                  '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                  "$tmp" >> all-nodes.txt

                total=$((total + count))
                success=$((success + 1))

              else

                echo "沒有識別到 URI 節點"

              fi

            else

              echo "來源抓取失敗"
              failed=$((failed + 1))

            fi

            rm -f "$tmp"

          done

          echo
          echo "================================"
          echo "抓取完成"
          echo "================================"

          echo "來源總數：${#SOURCES[@]}"
          echo "成功來源：$success"
          echo "失敗來源：$failed"
          echo "抓取節點：$total"

          if [ ! -s all-nodes.txt ]; then
            echo "沒有抓取到任何節點"
            exit 1
          fi

          sort -u all-nodes.txt > unique-nodes.txt

          UNIQUE=$(wc -l < unique-nodes.txt)

          echo "去重後節點：$UNIQUE"

          if [ "$UNIQUE" -lt 5 ]; then
            echo "節點數量太少，停止更新"
            exit 1
          fi


      # ============================================================
      # 4. 啟動 subconverter
      #
      # 不安裝 Docker
      # 直接使用 Runner 原本的 Docker
      # ============================================================
      - name: Start subconverter
        run: |
          set -e

          docker rm -f subconverter 2>/dev/null || true

          docker pull metacubex/subconverter:latest

          docker run -d \
            --name subconverter \
            -p 25500:25500 \
            metacubex/subconverter:latest

          echo "等待 subconverter 啟動"

          for i in $(seq 1 30); do

            if curl -fsS \
              http://127.0.0.1:25500/version \
              > /dev/null 2>&1; then

              echo "subconverter 已啟動"
              break

            fi

            sleep 2

          done

          curl -fsS \
            http://127.0.0.1:25500/version

          echo


      # ============================================================
      # 5. 用本地 HTTP 服務提供節點文件
      #
      # 避免直接把幾千個 URI 塞進 URL
      # ============================================================
      - name: Prepare subscription source
        run: |
          set -e

          mkdir -p web

          cp unique-nodes.txt web/nodes.txt

          echo "啟動本地 HTTP Server"

          cd web

          python3 -m http.server 8000 \
            --bind 0.0.0.0 \
            > ../http.log 2>&1 &

          echo $! > ../http.pid

          cd ..

          sleep 2

          echo "測試本地文件"

          curl -fsS \
            http://127.0.0.1:8000/nodes.txt \
            -o test-nodes.txt

          COUNT=$(wc -l < test-nodes.txt)

          echo "HTTP 文件節點：$COUNT"

          if [ "$COUNT" -lt 5 ]; then
            echo "本地節點文件異常"
            exit 1
          fi


      # ============================================================
      # 6. 轉換成 Clash
      # ============================================================
      - name: Convert to Clash
        run: |
          set -e

          echo "開始轉換"

          curl -fsS \
            --max-time 180 \
            "http://127.0.0.1:25500/sub?target=clash&url=http%3A%2F%2Fhost.docker.internal%3A8000%2Fnodes.txt&emoji=false" \
            -o clash.yaml

          if [ ! -s clash.yaml ]; then
            echo "Clash 配置為空"
            exit 1
          fi

          echo "Clash 配置生成成功"

          python3 - <<'PY'
          import yaml

          with open("clash.yaml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          proxies = data.get("proxies", [])

          print("Clash 節點數：", len(proxies))

          if len(proxies) < 5:
              raise SystemExit("Clash 節點少於 5 個")
          PY


      # ============================================================
      # 7. 建立 mihomo 測試配置
      # ============================================================
      - name: Download mihomo
        run: |
          set -e

          MIHOMO_VERSION="v1.19.29"

          curl -L \
            --retry 3 \
            --max-time 120 \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz" \
            -o mihomo.gz

          gunzip -f mihomo.gz

          chmod +x mihomo

          ./mihomo -v


      # ============================================================
      # 8. 建立測試配置
      # ============================================================
      - name: Build mihomo config
        run: |
          set -e

          python3 - <<'PY'
          import yaml

          with open("clash.yaml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          proxies = data.get("proxies", [])

          clean = []

          for i, proxy in enumerate(proxies):

              if not isinstance(proxy, dict):
                  continue

              if not proxy.get("name"):
                  proxy["name"] = f"node-{i}"

              clean.append(proxy)

          if not clean:
              raise SystemExit("沒有有效節點")

          names = [x["name"] for x in clean]

          data["proxies"] = clean

          data["proxy-groups"] = [
              {
                  "name": "AUTO",
                  "type": "url-test",
                  "url": "https://www.gstatic.com/generate_204",
                  "interval": 30,
                  "tolerance": 0,
                  "proxies": names
              }
          ]

          data["mixed-port"] = 7890
          data["external-controller"] = "127.0.0.1:9090"

          with open(
              "mihomo.yaml",
              "w",
              encoding="utf-8"
          ) as f:

              yaml.safe_dump(
                  data,
                  f,
                  allow_unicode=True,
                  sort_keys=False
              )

          print("測試節點：", len(clean))
          PY


      # ============================================================
      # 9. 啟動 mihomo
      # ============================================================
      - name: Start mihomo
        run: |
          set -e

          rm -rf mihomo-data
          mkdir -p mihomo-data

          ./mihomo \
            -d ./mihomo-data \
            -f ./mihomo.yaml \
            > mihomo.log 2>&1 &

          echo $! > mihomo.pid

          echo "等待 mihomo 啟動"

          READY=0

          for i in $(seq 1 40); do

            if curl -fsS \
              http://127.0.0.1:9090/version \
              > /dev/null 2>&1; then

              READY=1
              break

            fi

            sleep 2

          done

          if [ "$READY" != "1" ]; then

            echo "mihomo 啟動失敗"

            cat mihomo.log

            exit 1

          fi

          echo "mihomo 已啟動"

          curl -fsS \
            http://127.0.0.1:9090/version


      # ============================================================
      # 10. 等待節點實測
      # ============================================================
      - name: Test nodes
        run: |
          set -e

          echo "等待 URLTest"

          sleep 60

          curl -fsS \
            http://127.0.0.1:9090/proxies/AUTO \
            -o auto.json

          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          with open("auto.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          names = data.get("all", [])

          print("測試節點：", len(names))

          results = []

          for name in names:

              try:

                  encoded = urllib.parse.quote(
                      name,
                      safe=""
                  )

                  url = (
                      "http://127.0.0.1:9090/proxies/"
                      + encoded
                  )

                  with urllib.request.urlopen(
                      url,
                      timeout=5
                  ) as response:

                      item = json.loads(
                          response.read().decode("utf-8")
                      )

                  history = item.get("history", [])

                  if not history:
                      continue

                  delay = history[-1].get(
                      "delay",
                      0
                  )

                  if delay and delay > 0:

                      results.append(
                          {
                              "name": name,
                              "delay": delay
                          }
                      )

              except Exception:
                  continue

          results.sort(
              key=lambda x: x["delay"]
          )

          with open(
              "tested-nodes.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  results,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print("實測可用：", len(results))

          print()
          print("最快 10 個：")

          for i, item in enumerate(
              results[:10],
              1
          ):

              print(
                  f"{i}. "
                  f"{item['delay']} ms"
              )

          if len(results) < 5:

              raise SystemExit(
                  "實測可用節點少於 5 個，停止更新。"
              )
          PY


      # ============================================================
      # 11. 建立優選 Clash
      # ============================================================
      - name: Build optimized config
        run: |
          set -e

          python3 - <<'PY'
          import yaml
          import json

          with open(
              "clash.yaml",
              "r",
              encoding="utf-8"
          ) as f:

              source = yaml.safe_load(f)

          with open(
              "tested-nodes.json",
              "r",
              encoding="utf-8"
          ) as f:

              tested = json.load(f)

          best = tested[:100]

          wanted = {
              x["name"]
              for x in best
          }

          proxies = []

          for proxy in source.get(
              "proxies",
              []
          ):

              if proxy.get("name") in wanted:
                  proxies.append(proxy)

          result = {
              "proxies": proxies
          }

          with open(
              "optimized.yaml",
              "w",
              encoding="utf-8"
          ) as f:

              yaml.safe_dump(
                  result,
                  f,
                  allow_unicode=True,
                  sort_keys=False
              )

          print(
              "最終優選節點：",
              len(proxies)
          )

          if not proxies:
              raise SystemExit(
                  "優選後沒有節點"
              )
          PY


      # ============================================================
      # 12. 轉回 Shadowrocket 訂閱
      # ============================================================
      - name: Build Shadowrocket subscription
        run: |
          set -e

          mkdir -p final-web

          cp optimized.yaml final-web/optimized.yaml

          echo "啟動第二個本地 HTTP Server"

          cd final-web

          python3 -m http.server 8001 \
            --bind 0.0.0.0 \
            > ../final-http.log 2>&1 &

          echo $! > ../final-http.pid

          cd ..

          sleep 2

          curl -fsS \
            http://127.0.0.1:8001/optimized.yaml \
            > test-final.yaml

          if [ ! -s test-final.yaml ]; then
            echo "優選配置讀取失敗"
            exit 1
          fi

          echo "開始生成 Shadowrocket 訂閱"

          curl -fsS \
            --max-time 180 \
            "http://127.0.0.1:25500/sub?target=v2ray&url=http%3A%2F%2Fhost.docker.internal%3A8001%2Foptimized.yaml&emoji=false" \
            -o sub.txt

          if [ ! -s sub.txt ]; then
            echo "Shadowrocket 訂閱生成失敗"
            exit 1
          fi

          FINAL=$(wc -l < sub.txt)

          echo "最終訂閱節點：$FINAL"

          if [ "$FINAL" -lt 5 ]; then
            echo "最終訂閱少於 5 個節點"
            exit 1
          fi


      # ============================================================
      # 13. 保存更新時間
      # ============================================================
      - name: Save update status
        run: |
          set -e

          TESTED=$(python3 - <<'PY'
          import json

          with open(
              "tested-nodes.json",
              "r",
              encoding="utf-8"
          ) as f:

              print(len(json.load(f)))
          PY
          )

          FINAL=$(wc -l < sub.txt)

          NOW=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          cat > update-status.json <<EOF
          {
            "status": "success",
            "updated_at": "$NOW",
            "tested_nodes": $TESTED,
            "final_nodes": $FINAL,
            "schedule": "every 8 hours"
          }
          EOF

          cat update-status.json

          cat > daily-report.md <<EOF
          # Node Auto Optimizer

          最後成功更新：
          $NOW

          更新週期：
          每 8 小時

          實測可用：
          $TESTED

          最終優選：
          $FINAL
          EOF


      # ============================================================
      # 14. 保存訂閱
      #
      # 不發郵件
      # 不發 Telegram
      # ============================================================
      - name: Save subscription
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            sub.txt \
            daily-report.md \
            update-status.json

          if git diff --cached --quiet; then

            echo "沒有內容變化"

          else

            git commit \
              -m "Update optimized node subscription"

            git push

          fi
