name: Node Auto Update

on:
  schedule:
    - cron: "0 0,8,16 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. 抓取所有節點
      # ============================================================
      - name: Collect nodes
        shell: bash
        run: |
          set -u

          rm -f all-nodes.txt
          rm -f unique-nodes.txt
          rm -f selected-nodes.txt
          rm -f sub.txt
          rm -f daily-report.md

          SOURCES=(
            "https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/nodes.txt"
            "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt"
            "https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.txt"
            "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/clash.yml"
            "https://cdn.jsdelivr.net/gh/vxiaov/free_proxies@main/clash/clash.provider.yaml"
            "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub"
            "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.yml"
            "https://raw.githubusercontent.com/ts-sf/fly/main/clash"
          )

          echo "========================================"
          echo "開始收集節點"
          echo "========================================"

          total=0
          success=0
          failed=0

          for url in "${SOURCES[@]}"; do

            echo
            echo "來源：$url"

            tmp=$(mktemp)

            if curl -L \
              --connect-timeout 10 \
              --max-time 40 \
              --retry 2 \
              --retry-delay 2 \
              -A "Mozilla/5.0" \
              -fsS \
              "$url" \
              -o "$tmp"; then

              count=$(
                grep -Eo \
                '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                "$tmp" 2>/dev/null |
                wc -l |
                tr -d ' '
              )

              if [ "$count" -gt 0 ]; then

                grep -Eo \
                  '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                  "$tmp" \
                  >> all-nodes.txt

                total=$((total + count))
                success=$((success + 1))

                echo "找到：$count 個節點"

              else

                echo "沒有找到 URI 節點"

              fi

            else

              echo "抓取失敗"
              failed=$((failed + 1))

            fi

            rm -f "$tmp"

          done


          # ========================================================
          # 3. 檢查
          # ========================================================

          echo
          echo "========================================"
          echo "收集完成"
          echo "========================================"

          echo "來源總數：${#SOURCES[@]}"
          echo "成功來源：$success"
          echo "失敗來源：$failed"
          echo "原始節點：$total"

          if [ ! -s all-nodes.txt ]; then
            echo "ERROR：沒有收集到任何節點"
            exit 1
          fi


          # ========================================================
          # 4. 去重
          # ========================================================

          sort -u all-nodes.txt > unique-nodes.txt

          UNIQUE=$(wc -l < unique-nodes.txt | tr -d ' ')

          echo "去重後：$UNIQUE"


          if [ "$UNIQUE" -lt 1 ]; then
            echo "ERROR：去重後沒有節點"
            exit 1
          fi


          # ========================================================
          # 5. 隨機抽取 100 個
          # ========================================================

          if [ "$UNIQUE" -le 100 ]; then

            echo "節點不足 100 個"
            echo "全部使用"

            cp unique-nodes.txt selected-nodes.txt

          else

            echo "隨機抽取 100 個節點"

            shuf \
              -n 100 \
              unique-nodes.txt \
              > selected-nodes.txt

          fi


          SELECTED=$(wc -l < selected-nodes.txt | tr -d ' ')

          echo "最終節點：$SELECTED"


          if [ "$SELECTED" -lt 1 ]; then
            echo "ERROR：沒有選出任何節點"
            exit 1
          fi


          # ========================================================
          # 6. 生成 Base64 Shadowrocket 訂閱
          # ========================================================

          echo
          echo "開始生成訂閱"

          base64 -w 0 selected-nodes.txt > sub.txt

          echo >> sub.txt


          if [ ! -s sub.txt ]; then
            echo "ERROR：sub.txt 生成失敗"
            exit 1
          fi


          # ========================================================
          # 7. 生成更新報告
          # ========================================================

          NOW=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          cat > daily-report.md <<EOF
# Node Auto Update

最後更新：$NOW

更新週期：每 8 小時

## 節點統計

- 原始來源：${#SOURCES[@]}
- 成功來源：$success
- 失敗來源：$failed
- 原始節點：$total
- 去重節點：$UNIQUE
- 最終節點：$SELECTED

## 更新方式

每 8 小時重新抓取所有來源。

去除重複節點後：

- 隨機抽取最多 100 個節點
- 不進行測速
- 不進行延遲排序
- 不進行 mihomo 測試
- 不使用 subconverter

## Shadowrocket 訂閱地址

https://twit2er.github.io/daily-node-updater/sub.txt
EOF


          # ========================================================
          # 8. 顯示結果
          # ========================================================

          echo
          echo "========================================"
          echo "更新完成"
          echo "========================================"

          cat daily-report.md

          echo
          echo "最終節點數：$SELECTED"


      # ============================================================
      # 9. 保存訂閱
      # ============================================================
      - name: Save subscription
        shell: bash
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            sub.txt \
            daily-report.md

          if git diff --cached --quiet; then

            echo "沒有內容變化"

          else

            git commit \
              -m "Auto update node subscription"

            git push

          fi


      # ============================================================
      # 10. Telegram 通知
      # ============================================================
      - name: Telegram notification
        if: success()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "沒有設定 TELEGRAM_BOT_TOKEN，跳過通知"
            exit 0
          fi

          if [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "沒有設定 TELEGRAM_CHAT_ID，跳過通知"
            exit 0
          fi

          NOW=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          NODE_COUNT=$(wc -l < selected-nodes.txt | tr -d ' ')

          MESSAGE="🟢 節點訂閱更新成功

⏰ 更新時間：
${NOW}

🔄 更新週期：
每 8 小時

📦 最終節點：
${NODE_COUNT} 個

🎲 更新方式：
重新收集 → 去重 → 隨機抽取

🔗 訂閱：
https://twit2er.github.io/daily-node-updater/sub.txt"

          curl -fsS \
            --connect-timeout 10 \
            --max-time 30 \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

          echo
          echo "Telegram 通知已發送"
