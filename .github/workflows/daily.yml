name: Daily Node Update

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:


permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout
        uses: actions/checkout@v4



      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl



      - name: Fetch nodes
        run: |

          rm -f all.txt
          rm -f unique.txt


          urls=(

          "https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/nodes.txt"

          "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt"

          "https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.txt"

          "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub"

          )


          for url in "${urls[@]}"
          do

            echo "抓取: $url"

            curl -L \
            --connect-timeout 10 \
            --max-time 40 \
            -s "$url" >> all.txt || true

          done



          grep -Eo \
          '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^ "<>]+' \
          all.txt \
          | sort -u \
          > unique.txt



          count=$(wc -l < unique.txt)


          echo "找到節點: $count"



          if [ "$count" -lt 5 ]; then

            echo "節點不足"

            exit 1

          fi



      - name: Select nodes
        run: |

          shuf -n 100 unique.txt > final.txt


          echo "保留節點"

          wc -l final.txt



      - name: Build subscription
        run: |

          base64 -w 0 final.txt > sub.txt

          echo >> sub.txt



      - name: Create report
        run: |

          cat > daily-report.md <<EOF

# Daily Node Update


更新時間:

$(date -u)


狀態:

成功


節點數:

$(wc -l < final.txt)


訂閱:

https://twit2er.github.io/daily-node-updater/sub.txt


EOF




      - name: Save

        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"


          git add sub.txt daily-report.md


          git commit -m "auto update nodes" || exit 0


          git push




      - name: Telegram notify

        if: success()

        run: |

          python3 - <<'PY'

          import os
          import urllib.request
          import urllib.parse


          token=os.environ["TOKEN"]

          chat=os.environ["CHAT"]


          msg="""
🟢 Node Update Success

更新完成

時間:
%s

節點:
%s

訂閱:
https://twit2er.github.io/daily-node-updater/sub.txt
""" % (

          __import__("datetime").datetime.now(),

          open("final.txt").read().count("\n")

          )


          url=f"https://api.telegram.org/bot{token}/sendMessage"


          data=urllib.parse.urlencode({

          "chat_id":chat,

          "text":msg

          }).encode()


          urllib.request.urlopen(

          urllib.request.Request(
          url,
          data=data
          )

          )


          PY


        env:

          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
