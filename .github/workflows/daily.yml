```yaml
name: Node Auto Optimizer

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. 安裝基本工具
      # ============================================================
      - name: Install tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            jq \
            python3 \
            python3-yaml

          echo "================================"
          echo "環境"
          echo "================================"

          python3 --version
          curl --version | head -1
          docker --version


      # ============================================================
      # 3. 抓取節點
      # ============================================================
      - name: Fetch nodes
        run: |
          set -e

          rm -f all-nodes.txt
          rm -f unique-nodes.txt
          rm -f source-*.txt

          SOURCES=(
            "https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/nodes.txt"
            "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt"
            "https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.txt"
            "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/clash.yml"
            "https://cdn.jsdelivr.net/gh/vxiaov/free_proxies@main/clash/clash.provider.yaml"
            "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub"
            "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.yml"
            "https://raw.githubusercontent.com/ts-sf/fly/main/clash"
          )

          total=0
          success=0
          failed=0
          index=0

          echo "================================"
          echo "開始抓取節點"
          echo "================================"

          for url in "${SOURCES[@]}"; do

            index=$((index + 1))

            echo
            echo "[$index/${#SOURCES[@]}]"
            echo "$url"

            tmp="source-${index}.txt"

            if curl -L \
              --connect-timeout 10 \
              --max-time 40 \
              --retry 2 \
              --retry-delay 2 \
              -A "Mozilla/5.0" \
              -sS \
              -o "$tmp" \
              "$url"; then

              count=$(grep -Eo \
                '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                "$tmp" 2>/dev/null | wc -l)

              if [ "$count" -gt 0 ]; then

                echo "識別到 $count 個節點"

                grep -Eo \
                  '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                  "$tmp" >> all-nodes.txt

                total=$((total + count))
                success=$((success + 1))

              else

                echo "沒有識別到 URI 節點"

              fi

            else

              echo "來源抓取失敗"
              failed=$((failed + 1))

            fi

            rm -f "$tmp"

          done

          echo
          echo "================================"
          echo "抓取完成"
          echo "================================"

          echo "來源總數：${#SOURCES[@]}"
          echo "成功來源：$success"
          echo "失敗來源：$failed"
          echo "抓取節點：$total"

          if [ ! -s all-nodes.txt ]; then
            echo "沒有抓取到任何節點"
            exit 1
          fi

          sort -u all-nodes.txt > unique-nodes.txt

          UNIQUE=$(wc -l < unique-nodes.txt)

          echo "去重後：$UNIQUE"

          if [ "$UNIQUE" -lt 5 ]; then
            echo "去重後節點少於 5 個"
            exit 1
          fi


      # ============================================================
      # 4. 啟動 subconverter
      #
      # 直接使用 Runner 已有 Docker
      # 不安裝 Docker、不碰 containerd
      # ============================================================
      - name: Start subconverter
        run: |
          set -e

          echo "啟動 subconverter"

          docker rm -f subconverter 2>/dev/null || true

          docker pull metacubex/subconverter:latest

          docker run -d \
            --name subconverter \
            -p 25500:25500 \
            metacubex/subconverter:latest

          echo "等待 subconverter..."

          READY=0

          for i in $(seq 1 30); do

            if curl -fsS \
              http://127.0.0.1:25500/version \
              > /dev/null 2>&1; then

              READY=1
              break

            fi

            sleep 2

          done

          if [ "$READY" != "1" ]; then

            echo "subconverter 啟動失敗"

            docker logs subconverter || true

            exit 1

          fi

          echo "subconverter 已啟動"

          curl -fsS \
            http://127.0.0.1:25500/version

          echo


      # ============================================================
      # 5. 將節點文件掛載進 subconverter
      #
      # 不使用 host.docker.internal
      # 不使用外部 HTTP
      # ============================================================
      - name: Prepare subconverter input
        run: |
          set -e

          echo "準備 subconverter 輸入文件"

          mkdir -p converter-input

          cp unique-nodes.txt \
            converter-input/nodes.txt

          echo "輸入節點："

          wc -l \
            converter-input/nodes.txt

          docker rm -f subconverter 2>/dev/null || true

          docker run -d \
            --name subconverter \
            -p 25500:25500 \
            -v "$(pwd)/converter-input:/input:ro" \
            metacubex/subconverter:latest

          echo "等待 subconverter..."

          READY=0

          for i in $(seq 1 30); do

            if curl -fsS \
              http://127.0.0.1:25500/version \
              > /dev/null 2>&1; then

              READY=1
              break

            fi

            sleep 2

          done

          if [ "$READY" != "1" ]; then

            echo "subconverter 啟動失敗"

            docker logs subconverter || true

            exit 1

          fi

          echo "subconverter 已準備完成"


      # ============================================================
      # 6. URI → Clash
      #
      # 直接讓 subconverter 讀容器內的 /input/nodes.txt
      # ============================================================
      - name: Convert to Clash
        run: |
          set -e

          echo "================================"
          echo "開始轉換 Clash"
          echo "================================"

          INPUT="/input/nodes.txt"

          echo "subconverter 輸入：$INPUT"

          curl -fsS \
            --max-time 180 \
            "http://127.0.0.1:25500/sub?target=clash&url=file://${INPUT}&emoji=false" \
            -o clash.yaml

          if [ ! -s clash.yaml ]; then

            echo "Clash 配置為空"

            docker logs subconverter || true

            exit 1

          fi

          echo "Clash 配置生成成功"

          python3 - <<'PY'
          import yaml

          with open(
              "clash.yaml",
              "r",
              encoding="utf-8"
          ) as f:
              data = yaml.safe_load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "Clash 配置格式錯誤"
              )

          proxies = data.get(
              "proxies",
              []
          )

          print(
              "Clash 節點數：",
              len(proxies)
          )

          if len(proxies) < 5:
              raise SystemExit(
                  "Clash 節點少於 5 個"
              )
          PY


      # ============================================================
      # 7. 下載 mihomo
      # ============================================================
      - name: Download mihomo
        run: |
          set -e

          MIHOMO_VERSION="v1.19.29"

          echo "下載 mihomo $MIHOMO_VERSION"

          curl -L \
            --retry 3 \
            --connect-timeout 15 \
            --max-time 120 \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz" \
            -o mihomo.gz

          gunzip -f mihomo.gz

          chmod +x mihomo

          ./mihomo -v


      # ============================================================
      # 8. 建立 mihomo 測試配置
      # ============================================================
      - name: Build mihomo config
        run: |
          set -e

          python3 - <<'PY'
          import yaml

          with open(
              "clash.yaml",
              "r",
              encoding="utf-8"
          ) as f:
              data = yaml.safe_load(f)

          proxies = data.get(
              "proxies",
              []
          )

          clean = []

          for i, proxy in enumerate(
              proxies
          ):

              if not isinstance(
                  proxy,
                  dict
              ):
                  continue

              if not proxy.get(
                  "name"
              ):

                  proxy["name"] = \
                      f"node-{i}"

              clean.append(
                  proxy
              )

          if len(clean) < 5:

              raise SystemExit(
                  "有效節點少於 5 個"
              )

          names = [
              p["name"]
              for p in clean
          ]

          data["proxies"] = clean

          data["proxy-groups"] = [
              {
                  "name": "AUTO",

                  "type": "url-test",

                  "url":
                      "https://www.gstatic.com/generate_204",

                  "interval": 30,

                  "tolerance": 0,

                  "proxies": names
              }
          ]

          data["mixed-port"] = 7890

          data["external-controller"] = \
              "127.0.0.1:9090"

          data["secret"] = ""

          with open(
              "mihomo.yaml",
              "w",
              encoding="utf-8"
          ) as f:

              yaml.safe_dump(
                  data,
                  f,
                  allow_unicode=True,
                  sort_keys=False
              )

          print(
              "mihomo 測試節點：",
              len(clean)
          )
          PY


      # ============================================================
      # 9. 啟動 mihomo
      # ============================================================
      - name: Start mihomo
        run: |
          set -e

          rm -rf mihomo-data

          mkdir -p mihomo-data

          ./mihomo \
            -d ./mihomo-data \
            -f ./mihomo.yaml \
            > mihomo.log 2>&1 &

          echo $! > mihomo.pid

          echo "等待 mihomo 啟動"

          READY=0

          for i in $(seq 1 40); do

            if curl -fsS \
              http://127.0.0.1:9090/version \
              > /dev/null 2>&1; then

              READY=1

              break

            fi

            sleep 2

          done

          if [ "$READY" != "1" ]; then

            echo "mihomo 啟動失敗"

            cat mihomo.log

            exit 1

          fi

          echo "mihomo 已啟動"

          curl -fsS \
            http://127.0.0.1:9090/version


      # ============================================================
      # 10. 實際測試節點
      # ============================================================
      - name: Test nodes
        run: |
          set -e

          echo
          echo "================================"
          echo "開始測試節點"
          echo "================================"

          echo "等待節點測試"

          sleep 60

          curl -fsS \
            http://127.0.0.1:9090/proxies/AUTO \
            -o auto.json

          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          with open(
              "auto.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          names = data.get(
              "all",
              []
          )

          print(
              "mihomo 節點：",
              len(names)
          )

          results = []

          for name in names:

              try:

                  encoded = \
                      urllib.parse.quote(
                          name,
                          safe=""
                      )

                  url = (
                      "http://127.0.0.1:9090"
                      "/proxies/"
                      + encoded
                  )

                  with urllib.request.urlopen(
                      url,
                      timeout=8
                  ) as response:

                      item = json.loads(
                          response
                          .read()
                          .decode(
                              "utf-8"
                          )
                      )

                  history = item.get(
                      "history",
                      []
                  )

                  if not history:
                      continue

                  delay = history[-1].get(
                      "delay",
                      0
                  )

                  if delay and delay > 0:

                      results.append(
                          {
                              "name": name,
                              "delay": delay
                          }
                      )

              except Exception:

                  continue

          results.sort(
              key=lambda x:
              x["delay"]
          )

          with open(
              "tested-nodes.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  results,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print(
              "實測可用：",
              len(results)
          )

          print()
          print(
              "最快 20 個："
          )

          for i, item in enumerate(
              results[:20],
              1
          ):

              print(
                  f"{i:02d}. "
                  f"{item['delay']} ms"
              )

          if len(results) < 5:

              raise SystemExit(
                  "實測可用節點少於 5 個，"
                  "停止更新，保留原訂閱。"
              )
          PY


      # ============================================================
      # 11. 建立前 100 名優選配置
      # ============================================================
      - name: Build optimized config
        run: |
          set -e

          python3 - <<'PY'
          import yaml
          import json

          with open(
              "clash.yaml",
              "r",
              encoding="utf-8"
          ) as f:

              source = yaml.safe_load(f)

          with open(
              "tested-nodes.json",
              "r",
              encoding="utf-8"
          ) as f:

              tested = json.load(f)

          best = tested[:100]

          wanted = {
              x["name"]
              for x in best
          }

          proxies = []

          for proxy in source.get(
              "proxies",
              []
          ):

              if proxy.get(
                  "name"
              ) in wanted:

                  proxies.append(
                      proxy
                  )

          print(
              "優選節點：",
              len(proxies)
          )

          if len(proxies) < 5:

              raise SystemExit(
                  "優選後節點少於 5 個"
              )

          result = {
              "proxies": proxies
          }

          with open(
              "optimized.yaml",
              "w",
              encoding="utf-8"
          ) as f:

              yaml.safe_dump(
                  result,
                  f,
                  allow_unicode=True,
                  sort_keys=False
              )
          PY


      # ============================================================
      # 12. 將優選結果放進第二個 subconverter 輸入目錄
      # ============================================================
      - name: Prepare final converter
        run: |
          set -e

          mkdir -p final-input

          cp optimized.yaml \
            final-input/optimized.yaml

          echo "優選配置："

          ls -lh \
            final-input/optimized.yaml


      # ============================================================
      # 13. 重新啟動 subconverter，掛載優選配置
      # ============================================================
      - name: Restart subconverter for final conversion
        run: |
          set -e

          docker rm -f subconverter \
            2>/dev/null || true

          docker run -d \
            --name subconverter \
            -p 25500:25500 \
            -v "$(pwd)/final-input:/input:ro" \
            metacubex/subconverter:latest

          echo "等待 subconverter"

          READY=0

          for i in $(seq 1 30); do

            if curl -fsS \
              http://127.0.0.1:25500/version \
              > /dev/null 2>&1; then

              READY=1

              break

            fi

            sleep 2

          done

          if [ "$READY" != "1" ]; then

            docker logs subconverter || true

            exit 1

          fi

          echo "subconverter 已就緒"


      # ============================================================
      # 14. 生成 Shadowrocket 訂閱
      # ============================================================
      - name: Build Shadowrocket subscription
        run: |
          set -e

          echo "開始生成 Shadowrocket 訂閱"

          curl -fsS \
            --max-time 180 \
            "http://127.0.0.1:25500/sub?target=v2ray&url=file:///input/optimized.yaml&emoji=false" \
            -o sub.txt

          if [ ! -s sub.txt ]; then

            echo "Shadowrocket 訂閱為空"

            docker logs subconverter || true

            exit 1

          fi

          FINAL=$(wc -l < sub.txt)

          echo
          echo "================================"
          echo "最終結果"
          echo "================================"

          echo "Shadowrocket 節點：$FINAL"

          if [ "$FINAL" -lt 5 ]; then

            echo "最終節點少於 5 個"

            exit 1

          fi


      # ============================================================
      # 15. 記錄最後成功更新時間
      #
      # 這個文件給 TG /start 查詢
      # ============================================================
      - name: Save update status
        run: |
          set -e

          TESTED=$(python3 - <<'PY'
          import json

          with open(
              "tested-nodes.json",
              "r",
              encoding="utf-8"
          ) as f:

              print(
                  len(
                      json.load(f)
                  )
              )
          PY
          )

          FINAL=$(wc -l < sub.txt)

          NOW=$(date -u \
            '+%Y-%m-%d %H:%M:%S UTC')

          cat > update-status.json <<EOF
          {
            "status": "success",
            "updated_at": "$NOW",
            "schedule": "every 8 hours",
            "tested_nodes": $TESTED,
            "final_nodes": $FINAL
          }
          EOF

          cat > daily-report.md <<EOF
          # Node Auto Optimizer

          最後成功更新：
          $NOW

          更新週期：
          每 8 小時

          實測可用：
          $TESTED

          最終優選：
          $FINAL
          EOF

          echo "================================"
          echo "更新成功"
          echo "================================"

          cat update-status.json


      # ============================================================
      # 16. 保存最終訂閱
      #
      # 只有全部成功才會執行
      # 因此失敗不會覆蓋舊訂閱
      # ============================================================
      - name: Save subscription
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            sub.txt \
            daily-report.md \
            update-status.json

          if git diff --cached --quiet; then

            echo "沒有內容變化"

          else

            git commit \
              -m "Update optimized node subscription"

            git push

          fi


      # ============================================================
      # 17. 清理
      # ============================================================
      - name: Cleanup
        if: always()
        run: |
          docker rm -f subconverter \
            2>/dev/null || true

          if [ -f mihomo.pid ]; then

            kill "$(cat mihomo.pid)" \
              2>/dev/null || true

          fi
```
