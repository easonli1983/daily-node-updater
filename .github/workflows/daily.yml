name: Daily Node Update

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and build subscription
        run: |
          python - <<'PY'
          import base64
          import os
          import re
          import time
          import urllib.request
          import urllib.error

          OUTPUT_FILE = "sub.txt"
          REPORT_FILE = "daily-report.md"

          SOURCES = [
              "https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/nodes.txt",
              "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt",
              "https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.txt",
              "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/clash.yml",
              "https://cdn.jsdelivr.net/gh/vxiaov/free_proxies@main/clash/clash.provider.yaml",
              "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub",
              "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.yml",
              "https://raw.githubusercontent.com/ts-sf/fly/main/clash"
          ]

          print("================================")
          print("开始获取节点")
          print("================================")

          all_nodes = []
          success_sources = 0
          failed_sources = 0

          def fetch(url):
              headers = {
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "*/*"
              }

              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers=headers
                      )

                      with urllib.request.urlopen(
                          req,
                          timeout=20
                      ) as response:
                          return response.read().decode(
                              "utf-8",
                              errors="ignore"
                          )

                  except urllib.error.HTTPError as e:
                      print(
                          f"⚠️ HTTP {e.code}，第 {attempt}/3 次"
                      )

                      if e.code in (403, 404):
                          return None

                      if attempt < 3:
                          time.sleep(attempt * 2)

                  except Exception as e:
                      print(
                          f"⚠️ 请求失败：{e}，第 {attempt}/3 次"
                      )

                      if attempt < 3:
                          time.sleep(attempt * 2)

              return None

          def extract_nodes(text):
              if not text:
                  return []

              nodes = []

              patterns = [
                  r"vmess://[^\s<>'\"]+",
                  r"vless://[^\s<>'\"]+",
                  r"trojan://[^\s<>'\"]+",
                  r"ss://[^\s<>'\"]+",
                  r"hysteria2://[^\s<>'\"]+",
                  r"hysteria://[^\s<>'\"]+"
              ]

              for pattern in patterns:
                  nodes.extend(re.findall(pattern, text))

              # 如果原文不是明文，尝试 Base64
              compact = re.sub(r"\s+", "", text)

              try:
                  decoded = base64.b64decode(
                      compact + "=" * (-len(compact) % 4),
                      validate=False
                  ).decode(
                      "utf-8",
                      errors="ignore"
                  )

                  if any(
                      x in decoded
                      for x in [
                          "vmess://",
                          "vless://",
                          "trojan://",
                          "ss://",
                          "hysteria://",
                          "hysteria2://"
                      ]
                  ):
                      for pattern in patterns:
                          nodes.extend(
                              re.findall(pattern, decoded)
                          )

              except Exception:
                  pass

              return nodes

          for source in SOURCES:
              print()
              print("正在获取：")
              print(source)

              content = fetch(source)

              if content is None:
                  print("❌ 本来源无法访问，跳过")
                  failed_sources += 1
                  continue

              nodes = extract_nodes(content)

              if nodes:
                  print(
                      "✅ 获取成功：",
                      len(nodes),
                      "个节点"
                  )
                  all_nodes.extend(nodes)
                  success_sources += 1
              else:
                  print(
                      "⚠️ 获取成功，但没有识别到节点"
                  )

          print()
          print("================================")
          print("源统计")
          print("================================")
          print("总来源：", len(SOURCES))
          print("成功来源：", success_sources)
          print("失败来源：", failed_sources)
          print("抓取节点：", len(all_nodes))

          # 去重
          unique_nodes = []
          seen = set()

          for node in all_nodes:
              node = node.strip()

              if not node:
                  continue

              if node not in seen:
                  seen.add(node)
                  unique_nodes.append(node)

          print("去重后节点：", len(unique_nodes))

          # 最多保留 100 个
          final_nodes = unique_nodes[:100]

          print("最终节点数量：", len(final_nodes))

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              for node in final_nodes:
                  f.write(node + "\n")

          report = f"""# Daily Node Update

          ## 节点更新结果

          - 来源数量：{len(SOURCES)}
          - 成功来源：{success_sources}
          - 失败来源：{failed_sources}
          - 抓取节点：{len(all_nodes)}
          - 去重后节点：{len(unique_nodes)}
          - 最终节点：{len(final_nodes)}

          ## 订阅地址

          https://twit2er.github.io/daily-node-updater/sub.txt
          """

          with open(
              REPORT_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(report)

          print()
          print("================================")
          print("生成完成")
          print("================================")
          print(
              "订阅地址："
          )
          print(
              "https://twit2er.github.io/daily-node-updater/sub.txt"
          )
          PY

      - name: Send email
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          with open(
              "daily-report.md",
              "r",
              encoding="utf-8"
          ) as f:
              report = f.read()

          html_report = report.replace(
              "\n",
              "<br>"
          )

          with open(
              "sub.txt",
              "r",
              encoding="utf-8"
          ) as f:
              node_count = len(
                  [
                      x for x in f.read().splitlines()
                      if x.strip()
                  ]
              )

          html = f"""
          <h2>Daily Node Update</h2>

          <p>{html_report}</p>

          <hr>

          <p>
          最终节点数量：{node_count}
          </p>

          <p>
          Shadowrocket 订阅地址：
          </p>

          <p>
          <a href="https://twit2er.github.io/daily-node-updater/sub.txt">
          https://twit2er.github.io/daily-node-updater/sub.txt
          </a>
          </p>
          """

          data = {
              "from": "Daily Update <onboarding@resend.dev>",
              "to": [
                  os.environ["EMAIL"]
              ],
              "subject": "Daily Update｜节点订阅更新",
              "html": html
          }

          req = urllib.request.Request(
              "https://api.resend.com/emails",
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Authorization":
                      "Bearer " +
                      os.environ["RESEND_API_KEY"],
                  "Content-Type":
                      "application/json",
                  "User-Agent":
                      "daily-node-updater/1.0"
              },
              method="POST"
          )

          with urllib.request.urlopen(
              req,
              timeout=30
          ) as response:
              print("📧 邮件发送成功")
              print(
                  response.read().decode("utf-8")
              )
          PY

        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL: ${{ secrets.EMAIL }}

      - name: Save subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sub.txt daily-report.md

          git diff --cached --quiet || \
            git commit -m "Update node subscription"

          git push
