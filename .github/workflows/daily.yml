```yaml
name: Node Auto Update

on:
  schedule:
    - cron: "0 0,8,16 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. 安裝 Python 工具
      # ============================================================

      - name: Install tools
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            jq \
            python3 \
            python3-yaml


      # ============================================================
      # 3. 下載 mihomo
      # ============================================================

      - name: Install mihomo
        shell: bash
        run: |
          set -e

          VERSION="v1.19.29"

          echo "下載 mihomo ${VERSION}"

          curl -L \
            --fail \
            --retry 3 \
            --connect-timeout 15 \
            --max-time 120 \
            -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-${VERSION}.gz"

          gunzip -f mihomo.gz

          chmod +x mihomo

          ./mihomo -v


      # ============================================================
      # 4. 抓取節點
      # ============================================================

      - name: Fetch nodes
        shell: bash
        run: |
          set -e

          rm -f all-nodes.txt
          rm -f unique-nodes.txt

          SOURCES=(
            "https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/nodes.txt"
            "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt"
            "https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.txt"
            "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/clash.yml"
            "https://cdn.jsdelivr.net/gh/vxiaov/free_proxies@main/clash/clash.provider.yaml"
            "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub"
            "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.yml"
            "https://raw.githubusercontent.com/ts-sf/fly/main/clash"
          )

          total=0
          success=0
          failed=0

          echo "========================================"
          echo "開始抓取節點"
          echo "========================================"

          for url in "${SOURCES[@]}"; do

            echo
            echo "來源：$url"

            tmp=$(mktemp)

            if curl -L \
              --fail \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 40 \
              --retry 2 \
              --retry-delay 2 \
              -A "Mozilla/5.0" \
              "$url" \
              -o "$tmp"; then

              count=$(
                grep -Eo \
                  '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                  "$tmp" \
                  2>/dev/null \
                  | wc -l \
                  | tr -d ' '
              )

              if [ "$count" -gt 0 ]; then

                grep -Eo \
                  '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                  "$tmp" \
                  >> all-nodes.txt

                total=$((total + count))
                success=$((success + 1))

                echo "找到 $count 個 URI 節點"

              else

                echo "來源可訪問，但沒有找到 URI"

              fi

            else

              echo "抓取失敗"

              failed=$((failed + 1))

            fi

            rm -f "$tmp"

          done

          echo
          echo "========================================"
          echo "抓取完成"
          echo "========================================"

          echo "來源總數：${#SOURCES[@]}"
          echo "成功來源：$success"
          echo "失敗來源：$failed"
          echo "抓取節點：$total"

          if [ ! -s all-nodes.txt ]; then
            echo "ERROR：沒有抓到任何節點"
            exit 1
          fi

          sort -u all-nodes.txt > unique-nodes.txt

          UNIQUE=$(wc -l < unique-nodes.txt | tr -d ' ')

          echo "去重後：$UNIQUE"

          if [ "$UNIQUE" -lt 5 ]; then
            echo "ERROR：去重後少於 5 個節點"
            exit 1
          fi


      # ============================================================
      # 5. 將 URI 轉成 mihomo YAML
      # ============================================================

      - name: Convert nodes
        shell: bash
        run: |
          set -e

          python3 <<'PY'

          import base64
          import json
          import urllib.parse
          import yaml


          def b64decode_text(text):

              text = text.strip()

              text += "=" * (-len(text) % 4)

              try:

                  return base64.b64decode(
                      text
                  ).decode(
                      "utf-8",
                      errors="ignore"
                  )

              except Exception:

                  return ""


          def parse_vmess(uri):

              try:

                  raw = uri[8:]

                  obj = json.loads(
                      b64decode_text(raw)
                  )

                  server = obj.get("add")
                  port = int(obj.get("port", 0))
                  uuid = obj.get("id")

                  if not server or not port or not uuid:
                      return None

                  name = (
                      obj.get("ps")
                      or
                      f"vmess-{server}"
                  )

                  node = {
                      "name": name,
                      "type": "vmess",
                      "server": server,
                      "port": port,
                      "uuid": uuid,
                      "alterId": int(
                          obj.get("aid", 0)
                      ),
                      "cipher": obj.get(
                          "scy",
                          "auto"
                      )
                  }

                  network = obj.get(
                      "net",
                      "tcp"
                  )

                  if network == "ws":

                      node["network"] = "ws"

                      ws = {}

                      path = obj.get("path")

                      host = obj.get("host")

                      if path:
                          ws["path"] = path

                      if host:
                          ws["headers"] = {
                              "Host": host
                          }

                      if ws:
                          node["ws-opts"] = ws

                  if str(
                      obj.get("tls", "")
                  ).lower() == "tls":

                      node["tls"] = True

                      sni = obj.get("sni")

                      if sni:
                          node["servername"] = sni

                  return node

              except Exception:

                  return None


          def parse_vless(uri):

              try:

                  u = urllib.parse.urlsplit(uri)

                  uuid = u.username
                  server = u.hostname
                  port = u.port

                  if not uuid or not server or not port:
                      return None

                  q = urllib.parse.parse_qs(
                      u.query
                  )

                  name = (
                      urllib.parse.unquote(
                          u.fragment
                      )
                      or
                      f"vless-{server}"
                  )

                  node = {
                      "name": name,
                      "type": "vless",
                      "server": server,
                      "port": port,
                      "uuid": uuid
                  }

                  security = q.get(
                      "security",
                      [""]
                  )[0]

                  if security == "tls":

                      node["tls"] = True

                  sni = q.get(
                      "sni",
                      [""]
                  )[0]

                  if sni:
                      node["servername"] = sni

                  network = q.get(
                      "type",
                      ["tcp"]
                  )[0]

                  if network == "ws":

                      node["network"] = "ws"

                      ws = {}

                      path = q.get(
                          "path",
                          [""]
                      )[0]

                      host = q.get(
                          "host",
                          [""]
                      )[0]

                      if path:
                          ws["path"] = path

                      if host:
                          ws["headers"] = {
                              "Host": host
                          }

                      if ws:
                          node["ws-opts"] = ws

                  return node

              except Exception:

                  return None


          def parse_trojan(uri):

              try:

                  u = urllib.parse.urlsplit(uri)

                  password = u.username
                  server = u.hostname
                  port = u.port

                  if not password or not server or not port:
                      return None

                  q = urllib.parse.parse_qs(
                      u.query
                  )

                  name = (
                      urllib.parse.unquote(
                          u.fragment
                      )
                      or
                      f"trojan-{server}"
                  )

                  node = {
                      "name": name,
                      "type": "trojan",
                      "server": server,
                      "port": port,
                      "password": password
                  }

                  sni = q.get(
                      "sni",
                      [""]
                  )[0]

                  if sni:
                      node["sni"] = sni

                  return node

              except Exception:

                  return None


          def parse_ss(uri):

              try:

                  raw = uri[5:]

                  if "#" in raw:

                      raw = raw.split(
                          "#",
                          1
                      )[0]

                  if "@" in raw:

                      auth, address = raw.rsplit(
                          "@",
                          1
                      )

                      if ":" not in auth:
                          return None

                      method, password = auth.split(
                          ":",
                          1
                      )

                      server, port = address.rsplit(
                          ":",
                          1
                      )

                      return {
                          "name":
                              f"ss-{server}",

                          "type":
                              "ss",

                          "server":
                              server,

                          "port":
                              int(port),

                          "cipher":
                              method,

                          "password":
                              password
                      }

                  decoded = b64decode_text(
                      raw
                  )

                  if decoded:

                      return parse_ss(
                          "ss://" + decoded
                      )

              except Exception:

                  pass

              return None


          def parse(uri):

              uri = uri.strip()

              if uri.startswith(
                  "vmess://"
              ):

                  return parse_vmess(
                      uri
                  )

              if uri.startswith(
                  "vless://"
              ):

                  return parse_vless(
                      uri
                  )

              if uri.startswith(
                  "trojan://"
              ):

                  return parse_trojan(
                      uri
                  )

              if uri.startswith(
                  "ss://"
              ):

                  return parse_ss(
                      uri
                  )

              return None


          nodes = []

          with open(
              "unique-nodes.txt",
              "r",
              encoding="utf-8"
          ) as f:

              for line in f:

                  line = line.strip()

                  if not line:
                      continue

                  node = parse(line)

                  if node:
                      nodes.append(node)


          # 去除重複名稱

          used = set()

          final = []

          for node in nodes:

              original_name = node["name"]

              name = original_name

              number = 2

              while name in used:

                  name = (
                      f"{original_name}-{number}"
                  )

                  number += 1

              node["name"] = name

              used.add(name)

              final.append(node)


          print(
              "成功解析：",
              len(final)
          )


          if len(final) < 5:

              raise SystemExit(
                  "成功解析節點少於 5 個"
              )


          config = {

              "mixed-port": 7890,

              "allow-lan": False,

              "mode": "rule",

              "log-level": "silent",

              "proxies": final,

              "proxy-groups": [
                  {
                      "name": "AUTO",

                      "type": "url-test",

                      "url":
                          "https://www.gstatic.com/generate_204",

                      "interval": 30,

                      "tolerance": 0,

                      "proxies": [
                          x["name"]
                          for x in final
                      ]
                  }
              ],

              "external-controller":
                  "127.0.0.1:9090"
          }


          with open(
              "mihomo.yaml",
              "w",
              encoding="utf-8"
          ) as f:

              yaml.safe_dump(
                  config,
                  f,
                  allow_unicode=True,
                  sort_keys=False
              )

          PY


      # ============================================================
      # 6. 啟動 mihomo
      # ============================================================

      - name: Start mihomo
        shell: bash
        run: |
          set -e

          mkdir -p mihomo-data

          ./mihomo \
            -d ./mihomo-data \
            -f ./mihomo.yaml \
            > mihomo.log 2>&1 &

          echo $! > mihomo.pid

          echo "等待 mihomo 啟動..."

          for i in $(seq 1 30); do

            if curl -fsS \
              http://127.0.0.1:9090/version \
              >/dev/null 2>&1; then

              echo "mihomo 已啟動"

              break

            fi

            sleep 2

          done

          if ! curl -fsS \
            http://127.0.0.1:9090/version \
            >/dev/null 2>&1; then

            echo "ERROR：mihomo 啟動失敗"

            cat mihomo.log

            exit 1

          fi


      # ============================================================
      # 7. 等待自動測速
      # ============================================================

      - name: Wait for node testing
        shell: bash
        run: |
          set -e

          echo "開始等待節點測速..."

          sleep 60

          echo "開始讀取測速結果"


      # ============================================================
      # 8. 取得每個節點的延遲
      # ============================================================

      - name: Test nodes
        shell: bash
        run: |
          set -e

          python3 <<'PY'

          import json
          import urllib.parse
          import urllib.request
          import time


          with open(
              "mihomo.yaml",
              "r",
              encoding="utf-8"
          ) as f:

              import yaml

              config = yaml.safe_load(f)


          proxies = config.get(
              "proxies",
              []
          )


          results = []


          print(
              "總節點：",
              len(proxies)
          )


          for index, proxy in enumerate(
              proxies,
              1
          ):

              name = proxy.get(
                  "name"
              )

              if not name:
                  continue

              try:

                  encoded = urllib.parse.quote(
                      name,
                      safe=""
                  )

                  url = (
                      "http://127.0.0.1:9090/"
                      "proxies/"
                      + encoded
                      + "/delay"
                      "?timeout=5000"
                      "&url="
                      + urllib.parse.quote(
                          "https://www.gstatic.com/generate_204",
                          safe=""
                      )
                  )

                  request = urllib.request.Request(
                      url
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=8
                  ) as response:

                      data = json.loads(
                          response.read().decode(
                              "utf-8"
                          )
                      )

                  delay = data.get(
                      "delay",
                      0
                  )

                  if delay and delay > 0:

                      results.append(
                          {
                              "name":
                                  name,

                              "delay":
                                  int(delay)
                          }
                      )

                      print(
                          f"[{index}] "
                          f"{delay} ms "
                          f"{name}"
                      )

              except Exception:

                  pass


          results.sort(
              key=lambda x:
                  x["delay"]
          )


          with open(
              "tested-nodes.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  results,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print()
          print(
              "========================================"
          )

          print(
              "測試成功：",
              len(results)
          )

          print(
              "========================================"
          )


          for i, item in enumerate(
              results[:20],
              1
          ):

              print(
                  f"{i:02d}. "
                  f"{item['delay']} ms "
                  f"{item['name']}"
              )


          if len(results) < 5:

              raise SystemExit(
                  "實測成功節點少於 5 個，"
                  "本次停止更新。"
              )

          PY


      # ============================================================
      # 9. 產生優選 YAML
      # ============================================================

      - name: Build optimized config
        shell: bash
        run: |
          set -e

          python3 <<'PY'

          import json
          import yaml


          with open(
              "mihomo.yaml",
              "r",
              encoding="utf-8"
          ) as f:

              source = yaml.safe_load(
                  f
              )


          with open(
              "tested-nodes.json",
              "r",
              encoding="utf-8"
          ) as f:

              tested = json.load(
                  f
              )


          # 最多保留 100 個最快節點

          best = tested[:100]


          wanted = {
              x["name"]
              for x in best
          }


          proxies = []


          for proxy in source.get(
              "proxies",
              []
          ):

              if proxy.get(
                  "name"
              ) in wanted:

                  proxies.append(
                      proxy
                  )


          print(
              "最終優選：",
              len(proxies)
          )


          if len(proxies) < 5:

              raise SystemExit(
                  "優選後少於 5 個節點"
              )


          optimized = {

              "proxies":
                  proxies
          }


          with open(
              "optimized.yaml",
              "w",
              encoding="utf-8"
          ) as f:

              yaml.safe_dump(
                  optimized,
                  f,
                  allow_unicode=True,
                  sort_keys=False
              )

          PY


      # ============================================================
      # 10. 產生 Shadowrocket Base64 訂閱
      # ============================================================

      - name: Build subscription
        shell: bash
        run: |
          set -e

          python3 <<'PY'

          import base64
          import json
          import urllib.parse
          import yaml


          with open(
              "optimized.yaml",
              "r",
              encoding="utf-8"
          ) as f:

              data = yaml.safe_load(
                  f
              )


          proxies = data.get(
              "proxies",
              []
          )


          uris = []


          # ========================================================
          # vmess
          # ========================================================

          for p in proxies:

              ptype = p.get(
                  "type"
              )

              name = p.get(
                  "name",
                  "node"
              )

              server = p.get(
                  "server"
              )

              port = p.get(
                  "port"
              )


              if not server or not port:
                  continue


              if ptype == "vmess":

                  obj = {

                      "v":
                          "2",

                      "ps":
                          name,

                      "add":
                          server,

                      "port":
                          str(port),

                      "id":
                          p.get(
                              "uuid",
                              ""
                          ),

                      "aid":
                          str(
                              p.get(
                                  "alterId",
                                  0
                              )
                          ),

                      "scy":
                          p.get(
                              "cipher",
                              "auto"
                          ),

                      "net":
                          p.get(
                              "network",
                              "tcp"
                          ),

                      "type":
                          "none"

                  }


                  if p.get(
                      "tls"
                  ):

                      obj["tls"] = "tls"


                  if p.get(
                      "servername"
                  ):

                      obj["sni"] = p[
                          "servername"
                      ]


                  ws = p.get(
                      "ws-opts"
                  )


                  if ws:

                      obj["path"] = ws.get(
                          "path",
                          "/"
                      )

                      headers = ws.get(
                          "headers",
                          {}
                      )

                      if headers.get(
                          "Host"
                      ):

                          obj["host"] = headers[
                              "Host"
                          ]


                  encoded = base64.b64encode(
                      json.dumps(
                          obj,
                          ensure_ascii=False,
                          separators=(
                              ",",
                              ":"
                          )
                      ).encode(
                          "utf-8"
                      )
                  ).decode(
                      "ascii"
                  )


                  uris.append(
                      "vmess://" + encoded
                  )


              # ====================================================
              # vless
              # ====================================================

              elif ptype == "vless":

                  query = {

                      "encryption":
                          "none",

                      "type":
                          p.get(
                              "network",
                              "tcp"
                          )
                  }


                  if p.get(
                      "tls"
                  ):

                      query["security"] = "tls"


                  if p.get(
                      "servername"
                  ):

                      query["sni"] = p[
                          "servername"
                      ]


                  ws = p.get(
                      "ws-opts"
                  )


                  if ws:

                      query["path"] = ws.get(
                          "path",
                          "/"
                      )

                      headers = ws.get(
                          "headers",
                          {}
                      )

                      if headers.get(
                          "Host"
                      ):

                          query["host"] = headers[
                              "Host"
                          ]


                  uri = (
                      "vless://"
                      + str(
                          p.get(
                              "uuid",
                              ""
                          )
                      )
                      + "@"
                      + str(server)
                      + ":"
                      + str(port)
                      + "?"
                      + urllib.parse.urlencode(
                          query
                      )
                      + "#"
                      + urllib.parse.quote(
                          name
                      )
                  )


                  uris.append(
                      uri
                  )


              # ====================================================
              # trojan
              # ====================================================

              elif ptype == "trojan":

                  query = {}


                  if p.get(
                      "sni"
                  ):

                      query["sni"] = p[
                          "sni"
                      ]


                  uri = (
                      "trojan://"
                      + urllib.parse.quote(
                          str(
                              p.get(
                                  "password",
                                  ""
                              )
                          ),
                          safe=""
                      )
                      + "@"
                      + str(server)
                      + ":"
                      + str(port)
                  )


                  if query:

                      uri += (
                          "?"
                          + urllib.parse.urlencode(
                              query
                          )
                      )


                  uri += (
                      "#"
                      + urllib.parse.quote(
                          name
                      )
                  )


                  uris.append(
                      uri
                  )


              # ====================================================
              # Shadowsocks
              # ====================================================

              elif ptype == "ss":

                  method = p.get(
                      "cipher",
                      "aes-128-gcm"
                  )

                  password = p.get(
                      "password",
                      ""
                  )


                  auth = (
                      method
                      + ":"
                      + password
                  )


                  encoded_auth = base64.b64encode(
                      auth.encode(
                          "utf-8"
                      )
                  ).decode(
                      "ascii"
                  )


                  uri = (
                      "ss://"
                      + encoded_auth
                      + "@"
                      + str(server)
                      + ":"
                      + str(port)
                      + "#"
                      + urllib.parse.quote(
                          name
                      )
                  )


                  uris.append(
                      uri
                  )


          print(
              "最終 URI：",
              len(uris)
          )


          if len(uris) < 5:

              raise SystemExit(
                  "最終訂閱少於 5 個節點"
              )


          content = "\n".join(
              uris
          )


          encoded = base64.b64encode(
              content.encode(
                  "utf-8"
              )
          ).decode(
              "ascii"
          )


          with open(
              "sub.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  encoded
              )

          PY


      # ============================================================
      # 11. 產生更新報告
      # ============================================================

      - name: Build report
        shell: bash
        run: |
          set -e

          NOW=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          TESTED=$(python3 <<'PY'
          import json

          with open(
              "tested-nodes.json",
              "r",
              encoding="utf-8"
          ) as f:

              print(
                  len(
                      json.load(f)
                  )
              )
          PY
          )

          FINAL=$(python3 <<'PY'
          import base64

          with open(
              "sub.txt",
              "r",
              encoding="utf-8"
          ) as f:

              encoded = f.read().strip()

          text = base64.b64decode(
              encoded
          ).decode(
              "utf-8",
              errors="ignore"
          )

          print(
              len(
                  [
                      x
                      for x in text.splitlines()
                      if x.strip()
                  ]
              )
          )
          PY
          )

          cat > daily-report.md <<EOF
# Node Auto Update

最後成功更新：
$NOW

更新週期：
每 8 小時

實測可用：
$TESTED

最終優選：
$FINAL

訂閱地址：

