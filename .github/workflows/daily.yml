      - name: Send email
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          with open("daily-report.md", "r", encoding="utf-8") as f:
              report = f.read()

          with open("sub.txt", "r", encoding="utf-8") as f:
              nodes = [
                  x.strip()
                  for x in f
                  if x.strip()
              ]

          email = os.environ.get("EMAIL", "").strip()
          api_key = os.environ.get("RESEND_API_KEY", "").strip()

          print("================================")
          print("准备发送邮件")
          print("================================")
          print("节点数量：", len(nodes))
          print("EMAIL Secret：", "已设置" if email else "未设置")
          print("RESEND_API_KEY：", "已设置" if api_key else "未设置")

          if not email:
              print("⚠️ EMAIL 未设置，跳过邮件发送。")
              raise SystemExit(0)

          if not api_key:
              print("⚠️ RESEND_API_KEY 未设置，跳过邮件发送。")
              raise SystemExit(0)

          html = f"""
          <h2>Daily Node Update</h2>

          <p>节点检查已经完成。</p>

          <ul>
            <li>最终节点数量：{len(nodes)}</li>
          </ul>

          <hr>

          <p>Shadowrocket 订阅地址：</p>

          <p>
          <a href="https://twit2er.github.io/daily-node-updater/sub.txt">
          https://twit2er.github.io/daily-node-updater/sub.txt
          </a>
          </p>

          <hr>

          <pre>{report}</pre>
          """

          data = {
              "from": "Daily Update <onboarding@resend.dev>",
              "to": [email],
              "subject": "Daily Update｜节点订阅更新",
              "html": html
          }

          req = urllib.request.Request(
              "https://api.resend.com/emails",
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + api_key,
                  "Content-Type": "application/json",
                  "User-Agent": "daily-node-updater/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = response.read().decode("utf-8")
                  print("📧 邮件发送成功")
                  print(result)

          except urllib.error.HTTPError as e:
              print("❌ Resend 返回 HTTP 错误：", e.code)
              print(e.read().decode("utf-8", errors="replace"))

          except Exception as e:
              print("❌ 邮件发送失败：", repr(e))

          print("================================")
          print("邮件步骤结束")
          print("================================")
          PY

        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL: ${{ secrets.EMAIL }}
