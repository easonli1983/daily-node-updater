name: Daily Node Update

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download nodes
        run: |
          curl -L -o nodes.txt https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/nodes.txt

      - name: Extract nodes
        run: |
          grep -Eo '(vmess|vless|trojan|ss)://[^ "<>]+' nodes.txt > sub.txt || true
          wc -l sub.txt

      - name: Save
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add sub.txt

          git commit -m "auto update" || true

          git push
