name: Node Auto Optimizer

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install tools
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y curl python3 python3-yaml

          MIHOMO_VERSION="v1.19.29"

          curl -L \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz" \
            -o mihomo.gz

          gunzip mihomo.gz
          chmod +x mihomo

          ./mihomo -v


      - name: Fetch nodes
        run: |
          set -e

          rm -f all-nodes.txt
          rm -f unique-nodes.txt
          rm -f sub.txt
          rm -f daily-report.md

          SOURCES=(
            "https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/nodes.txt"
            "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt"
            "https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.txt"
            "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/clash.yml"
            "https://cdn.jsdelivr.net/gh/vxiaov/free_proxies@main/clash/clash.provider.yaml"
            "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub"
            "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.yml"
            "https://raw.githubusercontent.com/ts-sf/fly/main/clash"
          )

          total=0
          success=0
          failed=0

          for i in "${!SOURCES[@]}"; do

            n=$((i + 1))
            url="${SOURCES[$i]}"
            file="source-$n.txt"

            echo "抓取 $n/${#SOURCES[@]}"
            echo "$url"

            if curl -L \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 2 \
              --retry-delay 2 \
              -A "Mozilla/5.0" \
              -fsS \
              "$url" \
              -o "$file"; then

              count=$(grep -Eo \
                '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                "$file" 2>/dev/null | wc -l)

              if [ "$count" -gt 0 ]; then

                grep -Eo \
                  '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                  "$file" >> all-nodes.txt

                total=$((total + count))
                success=$((success + 1))

                echo "成功：$count"

              else
                echo "沒有識別到節點"
              fi

            else
              echo "來源失敗"
              failed=$((failed + 1))
            fi

            rm -f "$file"

          done

          if [ ! -s all-nodes.txt ]; then
            echo "沒有抓到任何節點"
            exit 1
          fi

          sort -u all-nodes.txt > unique-nodes.txt

          UNIQUE=$(wc -l < unique-nodes.txt)

          echo "來源：${#SOURCES[@]}"
          echo "成功：$success"
          echo "失敗：$failed"
          echo "抓取：$total"
          echo "去重：$UNIQUE"


      - name: Build Clash config
        run: |
          set -e

          python3 - <<'PY'
          import base64
          import json
          import urllib.parse
          import urllib.request

          nodes = []

          with open("unique-nodes.txt", "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()

                  if not line:
                      continue

                  nodes.append(line)

          print("節點數：", len(nodes))

          # 分批送給 subconverter，避免 URL 過長
          configs = []

          batch_size = 50

          for i in range(0, len(nodes), batch_size):

              batch = nodes[i:i + batch_size]

              raw = "|".join(batch)

              encoded = urllib.parse.quote(raw, safe="")

              url = (
                  "https://sub.danmuji.org/sub"
                  "?target=clash"
                  "&url=" + encoded
                  + "&emoji=false"
              )

              print(
                  "轉換批次：",
                  i // batch_size + 1,
                  "節點：",
                  len(batch)
              )

              try:
                  with urllib.request.urlopen(
                      url,
                      timeout=60
                  ) as r:

                      text = r.read().decode("utf-8")

                  if "proxies:" in text:
                      configs.append(text)

              except Exception as e:
                  print("批次失敗：", e)

          if not configs:
              raise SystemExit(
                  "subconverter 沒有成功產生任何配置"
              )

          print("成功配置數：", len(configs))

          # 從 Clash YAML 中提取 proxies
          import yaml

          proxies = []

          for text in configs:

              try:
                  data = yaml.safe_load(text)

                  for proxy in data.get(
                      "proxies",
                      []
                  ):

                      if isinstance(proxy, dict):
                          proxies.append(proxy)

              except Exception as e:
                  print(
                      "解析配置失敗：",
                      e
                  )

          # 名稱去重
          result = []
          names = set()

          for proxy in proxies:

              name = proxy.get("name")

              if not name:
                  continue

              if name in names:
                  continue

              names.add(name)
              result.append(proxy)

          print(
              "最終 Clash 節點：",
              len(result)
          )

          if len(result) < 5:
              raise SystemExit(
                  "有效節點少於 5 個，停止更新"
              )

          config = {
              "mixed-port": 7890,
              "proxies": result
          }

          config["proxy-groups"] = [
              {
                  "name": "AUTO",
                  "type": "url-test",
                  "url": "https://www.gstatic.com/generate_204",
                  "interval": 60,
                  "tolerance": 0,
                  "proxies": [
                      x["name"]
                      for x in result
                  ]
              }
          ]

          config["rules"] = [
              "MATCH,AUTO"
          ]

          with open(
              "mihomo.yaml",
              "w",
              encoding="utf-8"
          ) as f:

              yaml.safe_dump(
                  config,
                  f,
                  allow_unicode=True,
                  sort_keys=False
              )

          print(
              "mihomo 配置建立完成"
          )

          PY


      - name: Start mihomo
        run: |
          set -e

          mkdir -p mihomo-data

          ./mihomo \
            -d ./mihomo-data \
            -f ./mihomo.yaml \
            > mihomo.log 2>&1 &

          echo $! > mihomo.pid

          echo "等待 mihomo..."

          for i in $(seq 1 30); do

            if curl -fsS \
              http://127.0.0.1:9090/version \
              >/dev/null 2>&1; then

              echo "mihomo 已啟動"
              break

            fi

            sleep 2

          done

          curl -fsS \
            http://127.0.0.1:9090/version


      - name: Test nodes
        run: |
          set -e

          echo "等待節點測試..."

          sleep 30

          curl -fsS \
            "http://127.0.0.1:9090/proxies/AUTO" \
            -o auto.json

          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          with open(
              "auto.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          names = data.get("all", [])

          print(
              "測試節點：",
              len(names)
          )

          results = []

          for name in names:

              try:

                  encoded = urllib.parse.quote(
                      name,
                      safe=""
                  )

                  url = (
                      "http://127.0.0.1:9090/"
                      "proxies/" +
                      encoded
                  )

                  with urllib.request.urlopen(
                      url,
                      timeout=10
                  ) as r:

                      item = json.loads(
                          r.read().decode(
                              "utf-8"
                          )
                      )

                  history = item.get(
                      "history",
                      []
                  )

                  if not history:
                      continue

                  delay = history[-1].get(
                      "delay",
                      0
                  )

                  if delay and delay > 0:

                      results.append({
                          "name": name,
                          "delay": delay
                      })

              except Exception:
                  continue

          results.sort(
              key=lambda x: x["delay"]
          )

          with open(
              "tested-nodes.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  results,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "實測可用：",
              len(results)
          )

          for i, item in enumerate(
              results[:20],
              1
          ):

              print(
                  i,
                  item["delay"],
                  "ms",
                  item["name"]
              )

          if len(results) < 5:
              raise SystemExit(
                  "實測可用節點少於 5 個，停止更新"
              )

          PY


      - name: Build optimized subscription
        run: |
          set -e

          python3 - <<'PY'
          import base64
          import json
          import urllib.parse
          import urllib.request
          import yaml

          with open(
              "mihomo.yaml",
              "r",
              encoding="utf-8"
          ) as f:

              source = yaml.safe_load(f)

          with open(
              "tested-nodes.json",
              "r",
              encoding="utf-8"
          ) as f:

              tested = json.load(f)

          best = tested[:100]

          wanted = {
              x["name"]
              for x in best
          }

          proxies = []

          for proxy in source.get(
              "proxies",
              []
          ):

              if proxy.get("name") in wanted:
                  proxies.append(proxy)

          print(
              "優選節點：",
              len(proxies)
          )

          if len(proxies) < 5:
              raise SystemExit(
                  "優選節點不足"
              )

          # 建立只含優選節點的 Clash
          optimized = {
              "proxies": proxies
          }

          text = yaml.safe_dump(
              optimized,
              allow_unicode=True,
              sort_keys=False
          )

          # 使用本地臨時 HTTP server
          with open(
              "optimized.yaml",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(text)

          # 直接把每個 proxy 轉回 URI
          # 先保存 Clash 配置，下一步處理
          PY


      - name: Convert optimized nodes to Shadowrocket
        run: |
          set -e

          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import yaml

          with open(
              "mihomo.yaml",
              "r",
              encoding="utf-8"
          ) as f:

              source = yaml.safe_load(f)

          with open(
              "tested-nodes.json",
              "r",
              encoding="utf-8"
          ) as f:

              tested = json.load(f)

          best = tested[:100]

          wanted = {
              x["name"]
              for x in best
          }

          proxies = []

          for proxy in source.get(
              "proxies",
              []
          ):

              if proxy.get("name") in wanted:
                  proxies.append(proxy)

          print(
              "準備輸出：",
              len(proxies),
              "個節點"
          )

          # 使用 subconverter 的單節點轉換
          output = []

          for i, proxy in enumerate(
              proxies,
              1
          ):

              # 重新建立只有一個節點的 Clash
              one = {
                  "proxies": [proxy]
              }

              text = yaml.safe_dump(
                  one,
                  allow_unicode=True,
                  sort_keys=False
              )

              encoded = urllib.parse.quote(
                  text,
                  safe=""
              )

              url = (
                  "https://sub.danmuji.org/sub"
                  "?target=v2ray"
                  "&url=" + encoded
                  + "&emoji=false"
              )

              try:

                  with urllib.request.urlopen(
                      url,
                      timeout=30
                  ) as r:

                      result = r.read().decode(
                          "utf-8"
                      )

                  for line in result.splitlines():

                      line = line.strip()

                      if "://" in line:
                          output.append(line)

              except Exception as e:

                  print(
                      "節點轉換失敗：",
                      i,
                      e
                  )

          # 去重
          output = list(
              dict.fromkeys(output)
          )

          if len(output) < 5:
              raise SystemExit(
                  "Shadowrocket 訂閱生成失敗"
              )

          with open(
              "sub.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "\n".join(output)
                  + "\n"
              )

          print(
              "最終訂閱節點：",
              len(output)
          )

          PY


      - name: Build report
        run: |
          set -e

          TESTED=$(python3 - <<'PY'
          import json

          with open(
              "tested-nodes.json",
              "r",
              encoding="utf-8"
          ) as f:

              print(
                  len(json.load(f))
              )
          PY
          )

          FINAL=$(grep -c '://' sub.txt || true)

          cat > daily-report.md <<EOF
          # Daily Node Update

          最後成功更新：
          $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          更新週期：每 8 小時

          實測可用：$TESTED

          最終優選：$FINAL

          訂閱地址保持不變。
          EOF

          cat daily-report.md


      - name: Save subscription
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            sub.txt \
            daily-report.md

          if git diff --cached --quiet; then

            echo "訂閱內容沒有變化"

          else

            git commit \
              -m "Auto optimize nodes"

            git push

          fi
