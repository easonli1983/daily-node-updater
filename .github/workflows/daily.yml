name: Daily Node Update

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write


jobs:
  update:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl


      - name: Download nodes
        shell: bash
        run: |

          rm -f all.txt
          rm -f unique.txt
          rm -f sub.txt
          rm -f report.txt


          SOURCES=(
          "https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/nodes.txt"
          "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt"
          "https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.txt"
          "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub"
          )


          for url in "${SOURCES[@]}"
          do

            echo "下載:"
            echo "$url"

            curl -L \
            --connect-timeout 10 \
            --max-time 40 \
            -s "$url" >> all.txt || true

          done



          grep -Eo '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^ "<>]+' \
          all.txt \
          | sort -u \
          > unique.txt



          COUNT=$(wc -l < unique.txt)


          echo "節點數:"
          echo "$COUNT"


          if [ "$COUNT" -lt 1 ]
          then

            echo "沒有節點"
            exit 1

          fi



      - name: Select 100 nodes
        run: |

          shuf -n 100 unique.txt > final.txt


          COUNT=$(wc -l < final.txt)


          echo "保留:"
          echo "$COUNT"



      - name: Build subscription
        run: |

          base64 -w 0 final.txt > sub.txt

          echo >> sub.txt



      - name: Create report
        run: |

          cat > report.txt <<EOF

Node Update Success

Time:
$(date -u)

Nodes:
$(wc -l < final.txt)

Subscription:

https://twit2er.github.io/daily-node-updater/sub.txt

EOF



      - name: Commit update
        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"


          git add sub.txt report.txt


          git commit -m "auto update nodes" || exit 0


          git push
