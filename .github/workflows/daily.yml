name: Daily Node Update

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Download nodes
        run: |

          rm -f all.txt
          rm -f sub.txt


          curl -L -s \
          https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/nodes.txt \
          >> all.txt || true


          curl -L -s \
          https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt \
          >> all.txt || true


          curl -L -s \
          https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.txt \
          >> all.txt || true


          curl -L -s \
          https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub \
          >> all.txt || true



          grep -Eo '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^ "<>]+' \
          all.txt \
          | sort -u \
          > unique.txt



          shuf -n 100 unique.txt > final.txt


          echo "節點數:"
          wc -l final.txt



      - name: Install subconverter
        run: |

          docker pull ghcr.io/metacubex/subconverter:latest



      - name: Convert subscription
        run: |

          docker run -d \
          --name subconverter \
          -p 25500:25500 \
          ghcr.io/metacubex/subconverter:latest


          sleep 5


          python3 - <<'PY'

import urllib.parse

nodes=[]

with open("final.txt","r",encoding="utf-8") as f:
    for x in f:
        if x.strip():
            nodes.append(x.strip())


url="|".join(nodes)

print(urllib.parse.quote(url))

with open("url.txt","w",encoding="utf-8") as f:
    f.write(urllib.parse.quote(url))

PY


          URL=$(cat url.txt)


          curl -L \
          "http://127.0.0.1:25500/sub?target=clash&url=${URL}&emoji=false" \
          -o clash.yaml


          if [ ! -s clash.yaml ]; then
            echo "轉換失敗"
            exit 1
          fi



      - name: Build Shadowrocket subscription
        run: |

          base64 -w 0 final.txt > sub.txt

          echo >> sub.txt



      - name: Save
        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"


          git add sub.txt clash.yaml


          git commit -m "auto update nodes" || true


          git push
