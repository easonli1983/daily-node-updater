name: Node Auto Optimizer

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. 安裝工具
      # ============================================================
      - name: Install tools
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y curl jq python3 python3-yaml

          echo "下載 subconverter"

          docker pull ghcr.io/metacubex/subconverter:latest

          echo "下載 mihomo"

          MIHOMO_VERSION="v1.19.29"

          curl -L \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz" \
            -o mihomo.gz

          gunzip mihomo.gz

          chmod +x mihomo

          ./mihomo -v


      # ============================================================
      # 3. 啟動 subconverter
      # ============================================================
      - name: Start subconverter
        run: |
          set -e

          docker run -d \
            --name subconverter \
            -p 25500:25500 \
            ghcr.io/metacubex/subconverter:latest

          echo "等待 subconverter..."

          for i in $(seq 1 30); do

            if curl -fsS \
              http://127.0.0.1:25500/version \
              > /dev/null 2>&1; then

              echo "subconverter 已啟動"
              break

            fi

            sleep 2

          done

          curl -fsS \
            http://127.0.0.1:25500/version

          echo


      # ============================================================
      # 4. 抓取所有來源
      # ============================================================
      - name: Fetch sources
        run: |
          set -e

          rm -f all-nodes.txt
          rm -f unique-nodes.txt
          rm -f source-*.txt

          SOURCES=(
            "https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/nodes.txt"
            "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt"
            "https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.txt"
            "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/clash.yml"
            "https://cdn.jsdelivr.net/gh/vxiaov/free_proxies@main/clash/clash.provider.yaml"
            "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub"
            "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.yml"
            "https://raw.githubusercontent.com/ts-sf/fly/main/clash"
          )

          TOTAL=0
          SUCCESS=0
          FAILED=0
          INDEX=0

          echo "================================"
          echo "開始抓取節點"
          echo "================================"

          for URL in "${SOURCES[@]}"; do

            INDEX=$((INDEX + 1))

            echo
            echo "[$INDEX/${#SOURCES[@]}]"
            echo "$URL"

            FILE="source-${INDEX}.txt"

            if curl -L \
              --connect-timeout 10 \
              --max-time 45 \
              --retry 2 \
              --retry-delay 2 \
              -A "Mozilla/5.0" \
              -fsS \
              "$URL" \
              -o "$FILE"; then

              echo "抓取成功"

              # --------------------------------------------------
              # 直接 URI
              # --------------------------------------------------

              URI_COUNT=$(grep -Eo \
                '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                "$FILE" \
                2>/dev/null \
                | wc -l)

              if [ "$URI_COUNT" -gt 0 ]; then

                echo "發現 URI：$URI_COUNT"

                grep -Eo \
                  '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                  "$FILE" \
                  >> all-nodes.txt

                TOTAL=$((TOTAL + URI_COUNT))

              fi

              SUCCESS=$((SUCCESS + 1))

            else

              echo "抓取失敗"

              FAILED=$((FAILED + 1))

            fi

          done

          echo
          echo "================================"
          echo "抓取統計"
          echo "================================"

          echo "來源：${#SOURCES[@]}"
          echo "成功：$SUCCESS"
          echo "失敗：$FAILED"
          echo "URI：$TOTAL"

          if [ ! -s all-nodes.txt ]; then
            echo "沒有取得任何節點"
            exit 1
          fi

          sort -u all-nodes.txt > unique-nodes.txt

          UNIQUE=$(wc -l < unique-nodes.txt)

          echo "去重後：$UNIQUE"

          if [ "$UNIQUE" -lt 5 ]; then
            echo "去重後節點太少，停止更新"
            exit 1
          fi

          echo "$TOTAL" > total_count.txt
          echo "$UNIQUE" > unique_count.txt


      # ============================================================
      # 5. 使用 subconverter 將節點轉成 Clash
      # ============================================================
      - name: Convert to Clash
        run: |
          set -e

          ABS_PATH="$PWD/unique-nodes.txt"

          echo "輸入文件："
          echo "$ABS_PATH"

          python3 - <<'PY'
          import urllib.parse
          import os

          path = os.path.abspath("unique-nodes.txt")

          encoded = urllib.parse.quote(
              path,
              safe=""
          )

          with open(
              "encoded_source.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(encoded)

          print("subconverter 文件路徑：")
          print(path)
          PY

          URL=$(cat encoded_source.txt)

          curl -fsS \
            --max-time 180 \
            "http://127.0.0.1:25500/sub?target=clash&url=${URL}&emoji=false" \
            -o clash.yaml

          if [ ! -s clash.yaml ]; then
            echo "Clash 配置生成失敗"
            exit 1
          fi

          grep -q "^proxies:" clash.yaml

          python3 - <<'PY'
          import yaml

          with open(
              "clash.yaml",
              "r",
              encoding="utf-8"
          ) as f:

              data = yaml.safe_load(f)

          proxies = data.get("proxies", [])

          print("Clash 節點：", len(proxies))

          if len(proxies) < 5:
              raise SystemExit(
                  "Clash 節點少於 5 個"
              )
          PY


      # ============================================================
      # 6. 建立 mihomo 測速配置
      # ============================================================
      - name: Build mihomo config
        run: |
          set -e

          python3 - <<'PY'
          import yaml

          with open(
              "clash.yaml",
              "r",
              encoding="utf-8"
          ) as f:

              data = yaml.safe_load(f)

          proxies = data.get("proxies", [])

          clean = []

          for i, proxy in enumerate(proxies):

              if not isinstance(proxy, dict):
                  continue

              name = proxy.get("name")

              if not name:
                  name = f"node-{i}"

              proxy["name"] = str(name)

              clean.append(proxy)

          names = [
              p["name"]
              for p in clean
          ]

          data["proxies"] = clean

          data["mixed-port"] = 7890

          data["external-controller"] = "127.0.0.1:9090"

          data["secret"] = ""

          data["proxy-groups"] = [
              {
                  "name": "AUTO",
                  "type": "url-test",
                  "url": "https://www.gstatic.com/generate_204",
                  "interval": 30,
                  "timeout": 10000,
                  "tolerance": 0,
                  "lazy": False,
                  "proxies": names
              }
          ]

          with open(
              "mihomo.yaml",
              "w",
              encoding="utf-8"
          ) as f:

              yaml.safe_dump(
                  data,
                  f,
                  allow_unicode=True,
                  sort_keys=False
              )

          print("mihomo 節點：", len(clean))
          PY


      # ============================================================
      # 7. 啟動 mihomo
      # ============================================================
      - name: Start mihomo
        run: |
          set -e

          mkdir -p mihomo-data

          ./mihomo \
            -d ./mihomo-data \
            -f ./mihomo.yaml \
            > mihomo.log 2>&1 &

          echo $! > mihomo.pid

          echo "等待 mihomo..."

          READY=0

          for i in $(seq 1 40); do

            if curl -fsS \
              http://127.0.0.1:9090/version \
              > /dev/null 2>&1; then

              READY=1

              echo "mihomo 已啟動"

              break

            fi

            sleep 2

          done

          if [ "$READY" != "1" ]; then

            echo "mihomo 啟動失敗"

            cat mihomo.log

            exit 1

          fi

          curl -fsS \
            http://127.0.0.1:9090/version

          echo


      # ============================================================
      # 8. 等待第一次完整測速
      # ============================================================
      - name: Wait for node testing
        run: |
          set -e

          echo "等待 mihomo 完成節點測試..."

          sleep 90

          echo "開始讀取測速結果"


      # ============================================================
      # 9. 讀取實際測速結果
      # ============================================================
      - name: Test nodes
        run: |
          set -e

          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import time

          API = "http://127.0.0.1:9090"

          with urllib.request.urlopen(
              API + "/proxies",
              timeout=20
          ) as r:

              data = json.loads(
                  r.read().decode("utf-8")
              )

          proxies = data.get(
              "proxies",
              {}
          )

          results = []

          for name, info in proxies.items():

              if name in (
                  "DIRECT",
                  "REJECT",
                  "GLOBAL",
                  "AUTO"
              ):
                  continue

              if not isinstance(info, dict):
                  continue

              history = info.get(
                  "history",
                  []
              )

              if not history:
                  continue

              delay = history[-1].get(
                  "delay",
                  0
              )

              try:
                  delay = int(delay)
              except Exception:
                  continue

              if delay <= 0:
                  continue

              results.append({
                  "name": name,
                  "delay": delay
              })

          results.sort(
              key=lambda x: x["delay"]
          )

          with open(
              "tested-nodes.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  results,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print()
          print("==============================")
          print("實測結果")
          print("==============================")

          print(
              "可用節點：",
              len(results)
          )

          print()

          for i, item in enumerate(
              results[:20],
              1
          ):

              print(
                  f"{i:02d}. "
                  f"{item['delay']} ms  "
                  f"{item['name']}"
              )

          if len(results) < 5:

              raise SystemExit(
                  "實測成功節點少於 5 個，"
                  "停止更新，保留上一份訂閱。"
              )

          PY


      # ============================================================
      # 10. 建立優選 Clash
      # ============================================================
      - name: Build optimized Clash
        run: |
          set -e

          python3 - <<'PY'
          import yaml
          import json

          with open(
              "clash.yaml",
              "r",
              encoding="utf-8"
          ) as f:

              source = yaml.safe_load(f)

          with open(
              "tested-nodes.json",
              "r",
              encoding="utf-8"
          ) as f:

              tested = json.load(f)

          best = tested[:100]

          wanted = {
              item["name"]
              for item in best
          }

          proxies = []

          for proxy in source.get(
              "proxies",
              []
          ):

              if proxy.get("name") in wanted:

                  proxies.append(proxy)

          if len(proxies) < 5:

              raise SystemExit(
                  "優選後節點少於 5 個"
              )

          optimized = {
              "proxies": proxies
          }

          with open(
              "optimized.yaml",
              "w",
              encoding="utf-8"
          ) as f:

              yaml.safe_dump(
                  optimized,
                  f,
                  allow_unicode=True,
                  sort_keys=False
              )

          print(
              "最終優選節點：",
              len(proxies)
          )
          PY


      # ============================================================
      # 11. 轉回 Shadowrocket / V2Ray 訂閱
      # ============================================================
      - name: Build Shadowrocket subscription
        run: |
          set -e

          python3 - <<'PY'
          import urllib.parse
          import os

          path = os.path.abspath(
              "optimized.yaml"
          )

          encoded = urllib.parse.quote(
              path,
              safe=""
          )

          with open(
              "optimized_path.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(encoded)

          print(
              "優選文件：",
              path
          )
          PY

          URL=$(cat optimized_path.txt)

          curl -fsS \
            --max-time 180 \
            "http://127.0.0.1:25500/sub?target=v2ray&url=${URL}&emoji=false" \
            -o sub.txt

          if [ ! -s sub.txt ]; then

            echo "Shadowrocket 訂閱生成失敗"

            exit 1

          fi

          echo
          echo "================================"
          echo "訂閱生成成功"
          echo "================================"

          wc -l sub.txt

          head -n 2 sub.txt


      # ============================================================
      # 12. 生成最後更新狀態
      # ============================================================
      - name: Build status
        run: |
          set -e

          UTC_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          HK_TIME=$(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M:%S GMT+8')

          TESTED=$(python3 - <<'PY'
          import json

          with open(
              "tested-nodes.json",
              "r",
              encoding="utf-8"
          ) as f:

              print(len(json.load(f)))
          PY
          )

          FINAL=$(wc -l < sub.txt)

          cat > last_update.txt <<EOF
          status=success
          utc=$UTC_TIME
          local=$HK_TIME
          tested=$TESTED
          final=$FINAL
          interval=8h
          EOF

          cat last_update.txt


      # ============================================================
      # 13. 保存新的訂閱
      # ============================================================
      - name: Save subscription
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            sub.txt \
            last_update.txt

          if git diff --cached --quiet; then

            echo "沒有內容變化"

          else

            git commit \
              -m "Auto optimize nodes"

            git push

          fi

          echo
          echo "================================"
          echo "8 小時節點優選更新完成"
          echo "================================"
