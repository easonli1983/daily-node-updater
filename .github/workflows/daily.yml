name: Daily Update

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run daily task
        run: |
          echo "Daily update started."
          date -u
          echo "Daily update completed."
