name: Daily Node Update

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Collect and test nodes
        run: |
          python - <<'PY'
          import base64
          import concurrent.futures
          import json
          import os
          import re
          import socket
          import time
          import urllib.parse
          import urllib.request
          import yaml

          SOURCES = [
              "https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/nodes.txt",

              "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt",

              "https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.txt",

              "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/clash.yml",

              "https://cdn.jsdelivr.net/gh/vxiaov/free_proxies@main/clash/clash.provider.yaml",

              "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub",

              "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.yml",

              "https://raw.githubusercontent.com/ts-sf/fly/main/clash",
          ]

          TIMEOUT = 5
          MAX_WORKERS = 80

          URI_PREFIXES = (
              "vmess://",
              "vless://",
              "trojan://",
              "ss://",
              "ssr://",
              "hysteria://",
              "hysteria2://",
              "hy2://",
          )

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 Daily-Node-Updater"
                  }
              )

              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.read()

          def decode_text(raw):
              text = raw.decode("utf-8", errors="ignore").strip()

              # 先判断是不是已经是 URI
              if any(x in text for x in URI_PREFIXES):
                  return text

              # Base64
              compact = re.sub(r"\s+", "", text)

              try:
                  padded = compact + "=" * (-len(compact) % 4)
                  decoded = base64.b64decode(
                      padded,
                      validate=False
                  ).decode("utf-8", errors="ignore")

                  if any(x in decoded for x in URI_PREFIXES):
                      return decoded
              except Exception:
                  pass

              return text

          def yaml_to_uris(text):
              result = []

              try:
                  data = yaml.safe_load(text)
              except Exception:
                  return result

              if not isinstance(data, dict):
                  return result

              proxies = data.get("proxies", [])

              if not isinstance(proxies, list):
                  return result

              for p in proxies:
                  if not isinstance(p, dict):
                      continue

                  typ = str(p.get("type", "")).lower()
                  name = str(p.get("name", "node"))

                  try:

                      if typ == "vmess":
                          obj = {
                              "v": "2",
                              "ps": name,
                              "add": p.get("server", ""),
                              "port": str(p.get("port", "")),
                              "id": p.get("uuid", ""),
                              "aid": str(p.get("alterId", 0)),
                              "scy": p.get("cipher", "auto"),
                              "net": p.get("network", "tcp"),
                              "type": p.get("type", "none"),
                              "host": "",
                              "path": "",
                              "tls": ""
                          }

                          if p.get("tls"):
                              obj["tls"] = "tls"

                          if p.get("ws-opts"):
                              ws = p["ws-opts"]

                              headers = ws.get("headers", {})
                              obj["host"] = headers.get("Host", "")

                              obj["path"] = ws.get(
                                  "path",
                                  ""
                              )

                          encoded = base64.b64encode(
                              json.dumps(
                                  obj,
                                  ensure_ascii=False,
                                  separators=(",", ":")
                              ).encode()
                          ).decode()

                          result.append(
                              "vmess://" + encoded
                          )

                      elif typ == "vless":

                          server = p.get("server", "")
                          port = p.get("port", "")
                          uuid = p.get("uuid", "")

                          params = {
                              "encryption": p.get(
                                  "encryption",
                                  "none"
                              )
                          }

                          if p.get("network"):
                              params["type"] = p["network"]

                          if p.get("tls"):
                              params["security"] = "tls"

                          if p.get("servername"):
                              params["sni"] = p["servername"]

                          if p.get("flow"):
                              params["flow"] = p["flow"]

                          query = urllib.parse.urlencode(
                              params
                          )

                          result.append(
                              "vless://"
                              + uuid
                              + "@"
                              + str(server)
                              + ":"
                              + str(port)
                              + "?"
                              + query
                              + "#"
                              + urllib.parse.quote(name)
                          )

                      elif typ == "trojan":

                          server = p.get("server", "")
                          port = p.get("port", "")
                          password = p.get("password", "")

                          params = {}

                          if p.get("sni"):
                              params["sni"] = p["sni"]

                          if p.get("skip-cert-verify"):
                              params["allowInsecure"] = "1"

                          if p.get("network"):
                              params["type"] = p["network"]

                          query = urllib.parse.urlencode(
                              params
                          )

                          result.append(
                              "trojan://"
                              + urllib.parse.quote(password)
                              + "@"
                              + str(server)
                              + ":"
                              + str(port)
                              + "?"
                              + query
                              + "#"
                              + urllib.parse.quote(name)
                          )

                      elif typ == "ss":

                          server = p.get("server", "")
                          port = p.get("port", "")
                          cipher = p.get("cipher", "")
                          password = p.get("password", "")

                          userinfo = (
                              cipher
                              + ":"
                              + password
                          )

                          encoded = base64.urlsafe_b64encode(
                              userinfo.encode()
                          ).decode().rstrip("=")

                          result.append(
                              "ss://"
                              + encoded
                              + "@"
                              + str(server)
                              + ":"
                              + str(port)
                              + "#"
                              + urllib.parse.quote(name)
                          )

                      elif typ in (
                          "hysteria2",
                          "hy2"
                      ):

                          server = p.get("server", "")
                          port = p.get("port", "")
                          password = p.get("password", "")

                          params = {}

                          if p.get("sni"):
                              params["sni"] = p["sni"]

                          if p.get("skip-cert-verify"):
                              params["insecure"] = "1"

                          query = urllib.parse.urlencode(
                              params
                          )

                          result.append(
                              "hysteria2://"
                              + urllib.parse.quote(password)
                              + "@"
                              + str(server)
                              + ":"
                              + str(port)
                              + "?"
                              + query
                              + "#"
                              + urllib.parse.quote(name)
                          )

                  except Exception:
                      continue

              return result

          all_nodes = []

          print("开始抓取来源……")

          for source in SOURCES:

              try:

                  raw = fetch(source)

                  text = decode_text(raw)

                  uris = [
                      line.strip()
                      for line in text.splitlines()
                      if line.strip().startswith(
                          URI_PREFIXES
                      )
                  ]

                  # YAML
                  if not uris:
                      uris = yaml_to_uris(text)

                  print(
                      source,
                      "→",
                      len(uris),
                      "nodes"
                  )

                  all_nodes.extend(uris)

              except Exception as e:

                  print(
                      "SOURCE FAILED:",
                      source,
                      str(e)
                  )

          before = len(all_nodes)

          # 去重
          unique = []
          seen = set()

          for node in all_nodes:

              key = node.strip()

              if not key:
                  continue

              if key in seen:
                  continue

              seen.add(key)
              unique.append(key)

          print("抓取节点:", before)
          print("去重节点:", len(unique))

          # 提取服务器地址进行 TCP 连通性检测
          def get_host_port(node):

              try:

                  if node.startswith("vmess://"):

                      data = node[8:]
                      data += "=" * (-len(data) % 4)

                      obj = json.loads(
                          base64.b64decode(
                              data
                          ).decode()
                      )

                      return (
                          obj.get("add"),
                          int(obj.get("port"))
                      )

                  parsed = urllib.parse.urlparse(node)

                  if parsed.hostname and parsed.port:
                      return (
                          parsed.hostname,
                          parsed.port
                      )

              except Exception:
                  pass

              return None, None

          def test_node(node):

              host, port = get_host_port(node)

              if not host or not port:
                  return None

              try:

                  start = time.time()

                  with socket.create_connection(
                      (host, port),
                      timeout=TIMEOUT
                  ):
                      latency = (
                          time.time() - start
                      ) * 1000

                  return (
                      latency,
                      node
                  )

              except Exception:
                  return None

          print("开始检测节点连通性……")

          alive = []

          with concurrent.futures.ThreadPoolExecutor(
              max_workers=MAX_WORKERS
          ) as executor:

              futures = [
                  executor.submit(
                      test_node,
                      node
                  )
                  for node in unique
              ]

              for future in concurrent.futures.as_completed(
                  futures
              ):

                  result = future.result()

                  if result:
                      alive.append(result)

          alive.sort(
              key=lambda x: x[0]
          )

          # 最多保留 300 个
          alive = alive[:300]

          final_nodes = [
              node
              for latency, node in alive
          ]

          print("检测通过:", len(final_nodes))

          # Shadowrocket 通用 Base64
          plain = "\n".join(final_nodes)

          encoded = base64.b64encode(
              plain.encode("utf-8")
          ).decode("utf-8")

          with open(
              "public/sub.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(encoded + "\n")

          # 同时保存明文备份
          with open(
              "public/nodes.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(plain + "\n")

          report = f"""# Daily Node Report

          更新时间：{time.strftime("%Y-%m-%d %H:%M:%S UTC")}

          来源数量：{len(SOURCES)}

          抓取节点：{before}

          去重后：{len(unique)}

          连通检测通过：{len(final_nodes)}

          最终订阅：public/sub.txt
          """

          with open(
              "daily-report.md",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(report)

          with open(
              "node-stats.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  {
                      "sources": len(SOURCES),
                      "fetched": before,
                      "unique": len(unique),
                      "alive": len(final_nodes),
                      "time": time.time()
                  },
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(report)

          PY

      - name: Send node subscription email
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          with open(
              "daily-report.md",
              "r",
              encoding="utf-8"
          ) as f:
              report = f.read()

          with open(
              "public/sub.txt",
              "rb"
          ) as f:
              content = base64.b64encode(
                  f.read()
              ).decode()

          data = {
              "from": "Daily Node Update <onboarding@resend.dev>",
              "to": [
                  "easonli1983@gmail.com"
              ],
              "subject": "Daily Node Update｜最新节点订阅",
              "html": (
                  "<h2>🟢 Daily Node Update</h2>"
                  "<pre>"
                  + report
                  + "</pre>"
                  "<p>最新 Shadowrocket 订阅已经生成。</p>"
                  "<p>附件：sub.txt</p>"
              ),
              "attachments": [
                  {
                      "filename": "sub.txt",
                      "content": content
                  }
              ]
          }

          req = urllib.request.Request(
              "https://api.resend.com/emails",
              data=json.dumps(data).encode(
                  "utf-8"
              ),
              headers={
                  "Authorization":
                      "Bearer "
                      + os.environ[
                          "RESEND_API_KEY"
                      ],
                  "Content-Type":
                      "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(
              req,
              timeout=30
          ) as response:

              print(
                  response.read().decode()
              )

          PY

        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Save files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/sub.txt
          git add public/nodes.txt
          git add daily-report.md
          git add node-stats.json

          git diff --cached --quiet || git commit -m "Update node subscription"

          git push
