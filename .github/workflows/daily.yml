```yaml
name: Node Auto Update

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. 抓取節點
      # ==========================================
      - name: Fetch nodes
        shell: bash
        run: |
          set -e

          rm -f all-nodes.txt
          rm -f unique-nodes.txt
          rm -f sub.txt
          rm -f daily-report.md

          SOURCES=(
            "https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/nodes.txt"
            "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt"
            "https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.txt"
            "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/clash.yml"
            "https://cdn.jsdelivr.net/gh/vxiaov/free_proxies@main/clash/clash.provider.yaml"
            "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub"
            "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.yml"
            "https://raw.githubusercontent.com/ts-sf/fly/main/clash"
          )

          total=0
          success=0
          failed=0

          echo "========================================"
          echo "開始抓取節點"
          echo "========================================"

          for url in "${SOURCES[@]}"; do

            echo
            echo "來源：$url"

            tmp=$(mktemp)

            if curl -L \
              --connect-timeout 10 \
              --max-time 40 \
              --retry 2 \
              --retry-delay 2 \
              -A "Mozilla/5.0" \
              -fsS \
              "$url" \
              -o "$tmp"; then

              count=$(grep -Eo \
                '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                "$tmp" 2>/dev/null \
                | wc -l \
                | tr -d ' ')

              if [ "$count" -gt 0 ]; then

                grep -Eo \
                  '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                  "$tmp" \
                  >> all-nodes.txt

                total=$((total + count))
                success=$((success + 1))

                echo "成功：$count 個節點"

              else

                echo "可訪問，但沒有找到 URI 節點"

              fi

            else

              echo "抓取失敗"
              failed=$((failed + 1))

            fi

            rm -f "$tmp"

          done


          # ==========================================
          # 3. 檢查
          # ==========================================

          if [ ! -s all-nodes.txt ]; then
            echo "ERROR：沒有抓到任何節點"
            exit 1
          fi


          # ==========================================
          # 4. 去重
          # ==========================================

          sort -u all-nodes.txt > unique-nodes.txt

          UNIQUE=$(wc -l < unique-nodes.txt | tr -d ' ')

          echo
          echo "========================================"
          echo "抓取完成"
          echo "========================================"
          echo "來源總數：${#SOURCES[@]}"
          echo "成功來源：$success"
          echo "失敗來源：$failed"
          echo "抓取節點：$total"
          echo "去重節點：$UNIQUE"


          # ==========================================
          # 5. 建立 Shadowrocket Base64 訂閱
          #
          # Shadowrocket 可以直接使用
          # Base64 編碼的 URI 訂閱。
          #
          # 不再使用 subconverter。
          # ==========================================

          base64 -w 0 unique-nodes.txt > sub.txt

          echo >> sub.txt

          if [ ! -s sub.txt ]; then
            echo "ERROR：sub.txt 生成失敗"
            exit 1
          fi


          # ==========================================
          # 6. 更新報告
          # ==========================================

          NOW=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          cat > daily-report.md <<EOF
          # Node Auto Update

          最後更新：$NOW

          更新週期：每 8 小時

          - 原始來源：${#SOURCES[@]}
          - 成功來源：$success
          - 失敗來源：$failed
          - 抓取節點：$total
          - 去重節點：$UNIQUE

          訂閱地址：

          https://twit2er.github.io/daily-node-updater/sub.txt
          EOF

          echo
          cat daily-report.md


      # ==========================================
      # 7. 保存訂閱
      # ==========================================
      - name: Save subscription
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sub.txt daily-report.md

          if git diff --cached --quiet; then

            echo "內容沒有變化"

          else

            git commit -m "Auto update node subscription"

            git push

          fi
```
