```yaml
name: Daily Node Update

on:
  schedule:
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch nodes and build subscription
        run: |
          set +e

          rm -f all-nodes.txt sub.txt daily-report.md

          SOURCES=(
            "https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/nodes.txt"
            "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt"
            "https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.txt"
            "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/clash.yml"
            "https://cdn.jsdelivr.net/gh/vxiaov/free_proxies@main/clash/clash.provider.yaml"
            "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub"
            "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.yml"
            "https://raw.githubusercontent.com/ts-sf/fly/main/clash"
          )

          total=0
          success=0
          failed=0
          index=0

          echo "================================"
          echo "開始獲取節點"
          echo "================================"

          for url in "${SOURCES[@]}"; do
            index=$((index + 1))

            echo
            echo "[$index/${#SOURCES[@]}]"
            echo "正在獲取：$url"

            tmp="source-$index.txt"

            if curl -L \
              --connect-timeout 10 \
              --max-time 30 \
              --retry 2 \
              --retry-delay 2 \
              -A "Mozilla/5.0" \
              -sS \
              -o "$tmp" \
              -w "HTTP_STATUS:%{http_code}\n" \
              "$url" > "status-$index.txt" 2>&1; then

              status=$(grep "HTTP_STATUS:" "status-$index.txt" | tail -1 | cut -d: -f2)

              if [ "$status" = "200" ]; then
                echo "HTTP 200"

                count=$(grep -Eo \
                  '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                  "$tmp" | wc -l)

                if [ "$count" -gt 0 ]; then
                  echo "識別到 $count 個節點"

                  grep -Eo \
                    '(vmess|vless|trojan|ss|hysteria2|hysteria)://[^[:space:]<>"]+' \
                    "$tmp" >> all-nodes.txt

                  total=$((total + count))
                  success=$((success + 1))
                else
                  echo "可以訪問，但沒有識別到明文節點"
                fi
              else
                echo "HTTP $status，跳過"
                failed=$((failed + 1))
              fi
            else
              echo "請求失敗，跳過"
              failed=$((failed + 1))
            fi

            rm -f "$tmp" "status-$index.txt"
          done

          echo
          echo "================================"
          echo "源統計"
          echo "================================"
          echo "總來源：${#SOURCES[@]}"
          echo "成功來源：$success"
          echo "失敗來源：$failed"
          echo "抓取節點：$total"

          if [ ! -s all-nodes.txt ]; then
            echo "一個節點都沒有獲取到"
            exit 1
          fi

          sort -u all-nodes.txt > unique-nodes.txt

          unique=$(wc -l < unique-nodes.txt)

          head -n 100 unique-nodes.txt > sub.txt

          final=$(wc -l < sub.txt)

          echo "去重後節點：$unique"
          echo "最終節點：$final"

          cat > daily-report.md <<EOF
          # Daily Node Update

          檢測時間：$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          - 總來源：${#SOURCES[@]}
          - 成功來源：$success
          - 失敗來源：$failed
          - 抓取節點：$total
          - 去重後：$unique
          - 最終節點：$final

          ## Shadowrocket 訂閱地址

          https://twit2er.github.io/daily-node-updater/sub.txt
          EOF

          echo "訂閱文件已生成"

      - name: Send email
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          with open("daily-report.md", "r", encoding="utf-8") as f:
              report = f.read()

          with open("sub.txt", "r", encoding="utf-8") as f:
              nodes = [x.strip() for x in f if x.strip()]

          html = f"""
          <h2>Daily Node Update</h2>

          <p>節點檢測已完成。</p>

          <ul>
              <li>最終節點：{len(nodes)}</li>
          </ul>

          <hr>

          <p>Shadowrocket 訂閱地址：</p>

          <p>
          <a href="https://twit2er.github.io/daily-node-updater/sub.txt">
          https://twit2er.github.io/daily-node-updater/sub.txt
          </a>
          </p>

          <hr>

          <pre>{report}</pre>
          """

          data = {
              "from": "Daily Update <onboarding@resend.dev>",
              "to": [os.environ["EMAIL"]],
              "subject": "Daily Update｜節點訂閱更新",
              "html": html
          }

          req = urllib.request.Request(
              "https://api.resend.com/emails",
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + os.environ["RESEND_API_KEY"],
                  "Content-Type": "application/json",
                  "User-Agent": "daily-node-updater/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = response.read().decode("utf-8")
                  print("郵件發送成功")
                  print(result)

          except urllib.error.HTTPError as e:
              print("Resend HTTP 錯誤：", e.code)
              print(e.read().decode("utf-8"))
              raise
          PY

        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL: ${{ secrets.EMAIL }}

      - name: Send Telegram notification
        if: success()
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          with open("daily-report.md", "r", encoding="utf-8") as f:
              report = f.read()

          message = (
              "🟢 Daily Node Update\n\n"
              "節點更新成功\n\n"
              + report
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          data = {
              "chat_id": chat_id,
              "text": message
          }

          req = urllib.request.Request(
              url,
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              print("Telegram 通知發送成功")
              print(response.read().decode("utf-8"))
          PY

        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sub.txt daily-report.md

          git diff --cached --quiet || \
            git commit -m "Update node subscription"

          git push
```
